<style>

  canvas { display: block; }

  #loading {
    position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column;

  #loading.hide { opacity: 0; pointer-events: none; }
  .ring { width: 46px; height: 46px; border-radius: 50%; border: 1.5px solid rgba(80,150,255,.15);

  /* 悬浮蓝圈：固定在屏幕正中，不随相机旋转/缩放移动；地球触到它时淡出。

    50% { box-shadow: 0 8px 26px rgba(0,0,0,.42), 0 0 0 3px rgba(255,255,255,.32), inset 0 -4px 10px rgba(120,150,210,.30), 0 0 34px rgba(120,200,255,.64); } }
  /* 加载/切换：旋转小弧 */

<script type="module">
import * as THREE from 'three';
import { OrbitControls }   from 'three/addons/controls/OrbitControls.js';
import { EffectComposer }  from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }      from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass }      from 'three/addons/postprocessing/OutputPass.js';
import { FilesetResolver, GestureRecognizer } from '@mediapipe/tasks-vision';

const CFG = {
  radius        : 2.0,
  targetSamples : 200000,
  oceanKeep     : 0.02,
  fogCount      : 45000,    // 内部雾体（Normal 混合，把内部填满）
  mistCount     : 60000,   // 内部辉光雾（Additive）
  moonRadius    : 0.26,     // 月球半径（×R）
  moonDist      : 3.4,      // 月球轨道半径（×R）
  moonSpeed     : 0.012,    // 公转角速度 rad/s（很慢）
  cityPer       : 46,       // 每座城市的灯光点数
  citySpread    : 0.052,    // 城市灯光扩散半径（×R）
  ringRatio     : 0.34      // 悬浮蓝圈半径 = min(宽,高) × 此值
};

const SUN_DIR    = new THREE.Vector3(0.60, 0.28, 0.75).normalize();
const SUN_DIST   = 260;
const SUN_RADIUS = 8;
const TILT       = THREE.MathUtils.degToRad(23.5);

const $ = (id) => document.getElementById(id);
const frame = () => new Promise(r => requestAnimationFrame(r));
const setProgress = (t) => { $('progress').textContent = t; };
const setBar = (p) => { document.querySelector('#bar i').style.width = (Math.max(0, Math.min(1, p)) * 100).toFixed(1) + '%'; };
const setNote = (html) => { const n = $('note'); n.innerHTML = html; n.classList.add('on'); };

if (location.protocol === 'file:') {
  setNote('检测到 <b>file://</b> 协议：浏览器会拦截本地数据请求，页面将一直卡在加载。<br>' +
          '请用本地服务器打开（<b>python3 -m http.server 8000</b>）或部署到静态托管。');
}

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
} catch (e) {
  setNote('WebGL 初始化失败：当前浏览器 / 设备不支持 WebGL。');
  throw e;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.92;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000206);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 4000);
camera.position.set(0, 1.6, 6.8);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.rotateSpeed = 0.65;
controls.zoomSpeed = 0.8;
controls.minDistance = 3.2;
controls.maxDistance = 24;
controls.enablePan = false;
controls.target.set(0, 0, 0);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  0.34, 0.50, 0.74
);
composer.addPass(bloomPass);
composer.addPass(new OutputPass());

const LAND_BYTES = 3086715;
const SOURCES = [
  './vendor/land-10m.json',
  './vendor/land-110m.json',
  'https://cdn.jsdelivr.net/npm/world-atlas@2/land-10m.json',
  'https://cdn.jsdelivr.net/npm/world-atlas@2/land-110m.json'
];

async function fetchLand(url) {
  const ctrl = new AbortController();
  const kill = setTimeout(() => ctrl.abort(), 10000);
  let res;
  try {
    res = await fetch(url, { signal: ctrl.signal });
  } finally { clearTimeout(kill); }
  if (!res.ok) throw new Error('HTTP ' + res.status);

  const reader = res.body.getReader();
  const chunks = []; let received = 0, lastTick = Date.now();
  const stall = setInterval(() => {
    if (Date.now() - lastTick > 4000) { try { reader.cancel(); } catch (e) {} }
  }, 500);
  try {
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value); received += value.length; lastTick = Date.now();
      const p = Math.min(1, received / LAND_BYTES);
      setBar(0.02 + 0.68 * p);
      setProgress('下载陆地数据… ' + Math.round(p * 100) + '%');
    }
  } finally { clearInterval(stall); }
  if (received < 200000) throw new Error('下载不完整: ' + received);
  return JSON.parse(await new Blob(chunks).text());
}

async function loadLandGeoJSON() {
  for (const url of SOURCES) {
    for (let attempt = 0; attempt < 2; attempt++) {
      try {
        setProgress(attempt ? '网络停滞，正在重试…' : '连接数据源…'); setBar(0.01);
        const topo = await fetchLand(url);
        setProgress('解析陆地数据…'); setBar(0.72); await frame();
        const land = topojson.feature(topo, topo.objects.land || Object.values(topo.objects)[0]);
        setBar(0.78);
        console.log('[Earth] 陆地数据已加载:', url);
        return { land, url };
      } catch (e) {
        console.warn('[Earth] 源失败:', url, e);
        if (attempt === 0) { setProgress('连接中断，重试中…'); await new Promise(r => setTimeout(r, 800)); }
      }
    }
  }
  return null;
}

function rasterizeLand(landGeo) {
  const W = 2048, H = 1024;
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d', { willReadFrequently: true });
  ctx.fillStyle = '#ff0000';

  const geoms = landGeo.type === 'FeatureCollection' ? landGeo.features.map(f => f.geometry)
              : landGeo.type === 'Feature' ? [landGeo.geometry]
              : [landGeo];

  for (const g of geoms) {
    const polys = g.type === 'Polygon' ? [g.coordinates]
                : g.type === 'MultiPolygon' ? g.coordinates : [];
    for (const poly of polys) {
      for (const ring of poly) {
        const segs = []; let cur = [];
        for (let k = 0; k < ring.length; k++) {
          if (k > 0) {
            const q = ring[k - 1], p = ring[k];
            const dl = p[0] - q[0];
            if (Math.abs(dl) > 180) {
              const t = (180 - Math.abs(q[0])) / Math.abs(dl);
              const li = q[1] + (p[1] - q[1]) * t;
              const eg = q[0] > 0 ? 180 : -180;
              cur.push([eg, li]); segs.push(cur); cur = [[-eg, li]];
            }
          }
          cur.push(ring[k]);
        }
        if (cur.length) segs.push(cur);

        for (const seg of segs) {
          if (seg.length < 3) continue;
          ctx.beginPath();
          for (let k = 0; k < seg.length; k++) {
            const x = (seg[k][0] + 180) / 360 * W;
            const y = (90 - seg[k][1]) / 180 * H;
            k === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
          }
          ctx.closePath();
          ctx.fill('evenodd');
        }
      }
    }
  }
  return { data: ctx.getImageData(0, 0, W, H).data, W, H };
}

function isLandAt(t, lon, lat) {
  let x = Math.floor((lon + 180) / 360 * t.W); if (x < 0) x = 0; if (x >= t.W) x = t.W - 1;
  let y = Math.floor((90 - lat) / 180 * t.H);  if (y < 0) y = 0; if (y >= t.H) y = t.H - 1;
  return t.data[(y * t.W + x) * 4 + 3] > 40;
}

function fibSphere(i, n) {
  const y = 1 - (i / (n - 1)) * 2;
  const r = Math.sqrt(Math.max(0, 1 - y * y));
  const theta = i * Math.PI * (3 - Math.sqrt(5));
  return [Math.cos(theta) * r, y, Math.sin(theta) * r];
}
function toLonLat(x, y, z) {
  const len = Math.sqrt(x * x + y * y + z * z) || 1;
  const lon = Math.atan2(z / len, x / len) * 180 / Math.PI;
  const lat = Math.asin(Math.max(-1, Math.min(1, y / len))) * 180 / Math.PI;
  return [lon, lat];
}

let baseHSL = { h: 0, s: 0, l: 0 };
new THREE.Color('#3aa8ff').getHSL(baseHSL);
const _c = new THREE.Color();

/* 陆地：统一白色小点（不随纬度变化，全陆一致） */
function landColor() {
  return _c.setHSL(0, 0, 0.92);
}
function oceanColor() {
  return _c.setHSL((baseHSL.h + 0.03) % 1, 0.85, 0.22);
}

const VERT = `
  attribute float size;
  attribute vec3  aColor;
  uniform float uPixelRatio, uSizeScale;
  uniform vec3  uLightDir;
  uniform float uEmissive;   // 夜侧自发光强度（陆地微弱发光，内部雾几乎不发光）
  varying vec3  vColor;
  void main() {
    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
    vec3 n = normalize(mat3(modelMatrix) * normalize(position));
    float sun = smoothstep(-0.08, 0.55, dot(n, uLightDir));
    /* 夜侧底色 = 极暗环境光 + 自发光（陆地蓝点微微发亮） */
    vec3 nightC = vec3(0.07, 0.09, 0.15) + vec3(0.26, 0.34, 0.55) * uEmissive;
    vec3 tint = mix(nightC, vec3(1.0, 0.97, 0.92), sun);
    vColor = aColor * tint;
    gl_PointSize = size * uSizeScale * uPixelRatio * (9.0 / -mvPosition.z);
    gl_Position  = projectionMatrix * mvPosition;
  }
`;
const FRAG = `
  varying vec3 vColor;
  uniform float uTime;
  void main() {
    vec2 uv = gl_PointCoord - 0.5;
    float d2 = dot(uv, uv);
    if (d2 > 0.25) discard;
    /* 实心小圆点：中心到边缘快速截止，避免光斑式辉光 */
    float a = smoothstep(0.25, 0.18, d2);
    a *= 0.92 + 0.08 * sin(uTime * 1.8);
    gl_FragColor = vec4(vColor, a);
  }
`;
const FOG_FRAG = `
  varying vec3 vColor;
  uniform float uTime, uOpacity;
  void main() {
    vec2 uv = gl_PointCoord - 0.5;
    float d2 = dot(uv, uv);
    if (d2 > 0.25) discard;
    float a = smoothstep(0.25, 0.04, d2) * uOpacity;
    a *= 0.90 + 0.10 * sin(uTime * 1.8);
    gl_FragColor = vec4(vColor, a);
  }
`;
/* 内部雾专用顶点着色器：纯色直出，不受光照/夜侧影响，保证雾是白色 */
const FOG_VERT = `
  attribute float size;
  attribute vec3  aColor;
  uniform float uPixelRatio, uSizeScale;
  varying vec3  vColor;
  void main() {
    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
    vColor = aColor;
    gl_PointSize = size * uSizeScale * uPixelRatio * (9.0 / -mvPosition.z);
    gl_Position  = projectionMatrix * mvPosition;
  }
`;

let landTable = null, landGeoRef = null;
let earthPoints = null, fogPoints = null, mistPoints = null;
let building = false;

const spinner = new THREE.Group();
const tilt    = new THREE.Group();
tilt.rotation.z = TILT;
tilt.add(spinner);
scene.add(tilt);

const surfMat = new THREE.ShaderMaterial({
  uniforms: { uPixelRatio:{value:renderer.getPixelRatio()}, uSizeScale:{value:1}, uTime:{value:0}, uLightDir:{value:SUN_DIR.clone()}, uEmissive:{value:0.85} },
  vertexShader: VERT, fragmentShader: FRAG,
  transparent: true, depthWrite: true, depthTest: true, blending: THREE.NormalBlending
});
const fogMat = new THREE.ShaderMaterial({
  uniforms: { uPixelRatio:{value:renderer.getPixelRatio()}, uSizeScale:{value:1}, uTime:{value:0}, uLightDir:{value:SUN_DIR.clone()}, uOpacity:{value:0.16}, uEmissive:{value:0.0} },
  vertexShader: FOG_VERT, fragmentShader: FOG_FRAG,
  transparent: true, depthWrite: false, depthTest: true, blending: THREE.NormalBlending
});
const mistMat = new THREE.ShaderMaterial({
  uniforms: { uPixelRatio:{value:renderer.getPixelRatio()}, uSizeScale:{value:1}, uTime:{value:0}, uLightDir:{value:SUN_DIR.clone()}, uOpacity:{value:0.10}, uEmissive:{value:0.0} },
  vertexShader: FOG_VERT, fragmentShader: FOG_FRAG,
  transparent: true, depthWrite: false, depthTest: true, blending: THREE.AdditiveBlending
});
/* （外层防护罩已改为半透明蓝色球壳，见 buildShell；不再使用粒子雾壳） */

function makePoints(pos, col, siz, mat) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('aColor',   new THREE.Float32BufferAttribute(col, 3));
  g.setAttribute('size',     new THREE.Float32BufferAttribute(siz, 1));
  g.computeBoundingSphere();
  return new THREE.Points(g, mat);
}

function buildInterior() {
  const R = CFG.radius, col = new THREE.Color();
  const fPos = [], fCol = [], fSiz = [], mPos = [], mCol = [], mSiz = [];
  const rnd = () => {
    const u = Math.random() * 2 - 1, th = Math.random() * Math.PI * 2;
    const rr = Math.sqrt(Math.max(0, 1 - u * u));
    return [rr * Math.cos(th), u, rr * Math.sin(th)];
  };
  /* 从球心附近一直填到表面下方，确保内部是明显的白色 */
  for (let j = 0; j < CFG.fogCount; j++) {
    const [dx, dy, dz] = rnd();
    const r = R * (0.16 + 0.82 * Math.cbrt(Math.random()));
    fPos.push(dx * r, dy * r, dz * r);
    /* 内部雾：纯白色（饱和度 0），亮度足够高才能盖住蓝色底 */
    col.setHSL(0, 0, 0.20 + Math.random() * 0.06);
    fCol.push(col.r, col.g, col.b);
    fSiz.push(1.20 + Math.random() * 0.80);
  }
  for (let j = 0; j < CFG.mistCount; j++) {
    const [dx, dy, dz] = rnd();
    const r = R * (0.20 + 0.79 * Math.cbrt(Math.random()));
    mPos.push(dx * r, dy * r, dz * r);
    /* 内部辉光雾：纯白色，稍暗一点作层次 */
    col.setHSL(0, 0, 0.12 + Math.random() * 0.05);
    mCol.push(col.r, col.g, col.b);
    mSiz.push(1.00 + Math.random() * 0.70);
  }
  if (fogPoints)  { spinner.remove(fogPoints);  fogPoints.geometry.dispose(); }
  if (mistPoints) { spinner.remove(mistPoints); mistPoints.geometry.dispose(); }
  fogPoints  = makePoints(fPos, fCol, fSiz, fogMat);
  mistPoints = makePoints(mPos, mCol, mSiz, mistMat);
  spinner.add(fogPoints); spinner.add(mistPoints);
}

/* 外层「防护罩」：半透明蓝色球壳（透明蓝罩，带菲涅尔边缘发光）。
   使用 FrontSide 渲染，罩面正对相机一侧呈淡蓝半透明，边缘（视线擦过球面）
   因菲涅尔效应更亮，形成清晰的球罩轮廓；不随自转，保持稳定罩感。 */
let shellMesh = null;
function buildShell() {
  const R = CFG.radius;
  if (!shellMesh) {
    shellMesh = new THREE.Mesh(
      new THREE.SphereGeometry(R * 1.20, 64, 48),
      new THREE.ShaderMaterial({
        uniforms: {
          uColor:    { value: new THREE.Color(0x3aa8ff) },
          uOpacity:  { value: 0.10 },
          uPower:    { value: 3.6 },
          uStrength: { value: 0.55 }
        },
        vertexShader: `
          varying vec3 vN;
          varying vec3 vView;
          void main() {
            vN = normalize(normalMatrix * normal);
            vec4 mv = modelViewMatrix * vec4(position, 1.0);
            vView = normalize(-mv.xyz);
            gl_Position = projectionMatrix * mv;
          }`,
        fragmentShader: `
          uniform vec3  uColor;
          uniform float uOpacity, uPower, uStrength;
          varying vec3  vN;
          varying vec3  vView;
          void main() {
            float fres = pow(1.0 - abs(dot(normalize(vN), normalize(vView))), uPower);
            float a = uOpacity + fres * uStrength;
            a = clamp(a, 0.0, 0.55);
            gl_FragColor = vec4(uColor, a);
          }`,
        transparent: true, blending: THREE.NormalBlending,
        side: THREE.FrontSide, depthWrite: false
      })
    );
    tilt.add(shellMesh);
  }
}

async function buildSurface(N) {
  if (building || !landTable) return 0;
  building = true;
  const R = CFG.radius;
  const pos = [], col = [], siz = [];
  let landCount = 0, oceanCount = 0;

  for (let i = 0; i < N; i++) {
    if (i % 20000 === 0) {
      setProgress('采样陆地粒子… ' + Math.round(i / N * 100) + '%');
      setBar(0.9 + 0.1 * (i / N));
      await frame();
    }
    const [x, y, z] = fibSphere(i, N);
    const [lon, lat] = toLonLat(x, y, z);
    const isLand = isLandAt(landTable, lon, lat);

    if (!isLand && Math.random() > CFG.oceanKeep) continue;
    isLand ? landCount++ : oceanCount++;

    /* 陆地/海洋都在同一球面高度（半径固定，无随机扰动），平行排列 */
    const rr = R * (isLand ? 1.006 : 1.0);
    pos.push(x * rr, y * rr, z * rr);

    const c = isLand ? landColor() : oceanColor();
    col.push(c.r, c.g, c.b);
    /* 陆地：大小一致的蓝色小点；海洋：较小且略随机 */
    siz.push(isLand ? 0.50 : 0.28 + Math.random() * 0.14);
  }

  if (earthPoints) { spinner.remove(earthPoints); earthPoints.geometry.dispose(); }
  earthPoints = makePoints(pos, col, siz, surfMat);
  spinner.add(earthPoints);

  console.log('[Earth] 采样 ' + N + ' 点 · 陆地 ' + landCount + ' · 海洋 ' + oceanCount + ' · 最终 ' + pos.length / 3 + ' 粒子');
  building = false;
  return pos.length / 3;
}

function makeGlowTexture() {
  const S = 256, cv = document.createElement('canvas');
  cv.width = cv.height = S;
  const ctx = cv.getContext('2d');
  const g = ctx.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
  g.addColorStop(0.00, 'rgba(255,250,235,1.00)');
  g.addColorStop(0.14, 'rgba(255,225,170,0.72)');
  g.addColorStop(0.34, 'rgba(255,180, 95,0.24)');
  g.addColorStop(0.62, 'rgba(255,140, 50,0.07)');
  g.addColorStop(1.00, 'rgba(255,110, 20,0.00)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, S, S);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

/* 经纬度 → 球面局部坐标（与 toLonLat 严格互逆） */
function lonLatToVec(lat, lon, r) {
  const la = lat * Math.PI / 180, lo = lon * Math.PI / 180;
  return new THREE.Vector3(
    r * Math.cos(la) * Math.cos(lo),
    r * Math.sin(la),
    r * Math.cos(la) * Math.sin(lo)
  );
}

const CITY_VERT = `
  attribute float size;
  attribute vec3  aColor;
  attribute float phase;
  uniform float uPixelRatio, uSizeScale, uTime;
  uniform vec3  uLightDir;
  varying vec3  vColor; varying float vA;
  void main() {
    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
    vec3 n = normalize(mat3(modelMatrix) * normalize(position));
    float sun   = smoothstep(-0.12, 0.40, dot(n, uLightDir));
    float night = 1.0 - sun;
    float tw    = 0.80 + 0.20 * sin(uTime * 1.7 + phase * 6.2831);
    vColor = aColor;
    vA = pow(night, 1.30) * tw;
    gl_PointSize = size * uSizeScale * uPixelRatio * (9.0 / -mvPosition.z);
    gl_Position  = projectionMatrix * mvPosition;
  }`;
const CITY_FRAG = `
  varying vec3 vColor; varying float vA;
  void main() {
    vec2 uv = gl_PointCoord - 0.5;
    float d2 = dot(uv, uv);
    if (d2 > 0.25) discard;
    float a = smoothstep(0.25, 0.03, d2) * vA;
    if (a < 0.004) discard;
    gl_FragColor = vec4(vColor, a);
  }`;

const cityMat = new THREE.ShaderMaterial({
  uniforms: { uPixelRatio:{value:renderer.getPixelRatio()}, uSizeScale:{value:1},
              uTime:{value:0}, uLightDir:{value:SUN_DIR.clone()} },
  vertexShader: CITY_VERT, fragmentShader: CITY_FRAG,
  transparent: true, depthWrite: false, depthTest: true, blending: THREE.AdditiveBlending
});

let cityPoints = null;
const cityMarks = [];          // { name, local:Vector3, el:HTMLElement }
const cityLayer = $('cities');

function buildCities() {
  const R = CFG.radius;
  const pos = [], col = [], siz = [], pha = [];
  const c = new THREE.Color();
  const Y = new THREE.Vector3(0, 1, 0);

  for (const [name, lat, lon] of CITIES) {
    const base = lonLatToVec(lat, lon, R * 1.012);
    /* 该点处的切平面正交基 */
    const n  = base.clone().normalize();
    const t1 = new THREE.Vector3().crossVectors(Y, n);
    if (t1.lengthSq() < 1e-6) t1.set(1, 0, 0);   // 极点退化
    t1.normalize();
    const t2 = new THREE.Vector3().crossVectors(n, t1).normalize();

    for (let k = 0; k < CFG.cityPer; k++) {
      /* 中心密集、外缘稀疏的高斯式散布 */
      const ang = Math.random() * Math.PI * 2;
      const rad = Math.pow(Math.random(), 1.9) * CFG.citySpread * R;
      const p = base.clone()
        .addScaledVector(t1, Math.cos(ang) * rad)
        .addScaledVector(t2, Math.sin(ang) * rad);
      const L = R * 1.012 / p.length();
      p.multiplyScalar(L);
      pos.push(p.x, p.y, p.z);

      /* 霓虹绿灯光 → 核心偏亮绿白，外缘偏深绿 */
      const w = Math.random();
      c.setHSL(0.33, 0.90 - w * 0.30, 0.58 + (1 - Math.random()) * 0.30);
      col.push(c.r, c.g, c.b);
      siz.push(0.70 + Math.random() * 0.95);
      pha.push(Math.random());
    }

    const el = document.createElement('div');
    el.className = 'city';
    el.textContent = name;
    cityLayer.appendChild(el);
    cityMarks.push({ name, local: base.clone(), el });
  }

  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('aColor',   new THREE.Float32BufferAttribute(col, 3));
  g.setAttribute('size',     new THREE.Float32BufferAttribute(siz, 1));
  g.setAttribute('phase',    new THREE.Float32BufferAttribute(pha, 1));
  g.computeBoundingSphere();
  if (cityPoints) { spinner.remove(cityPoints); cityPoints.geometry.dispose(); }
  cityPoints = new THREE.Points(g, cityMat);
  spinner.add(cityPoints);
}

/* ── 月球：缓慢公转，自带明暗界线与月海斑块 ─────────────────── */
let moonPivot = null, moonMesh = null;
function buildMoon() {
  const R = CFG.radius;
  moonPivot = new THREE.Group();
  moonPivot.rotation.x = THREE.MathUtils.degToRad(11);
  scene.add(moonPivot);

  const mat = new THREE.ShaderMaterial({
    uniforms: { uLightDir: { value: SUN_DIR.clone() } },
    vertexShader: `
      varying vec3 vN; varying vec3 vP;
      void main() {
        vN = normalize(mat3(modelMatrix) * normal);
        vP = position;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }`,
    fragmentShader: `
      uniform vec3 uLightDir; varying vec3 vN; varying vec3 vP;
      float hash(vec3 p) { return fract(sin(dot(p, vec3(12.9898, 78.233, 37.719))) * 43758.5453); }
      void main() {
        vec3 n = normalize(vN), sp = normalize(vP);
        float lit = smoothstep(-0.10, 0.72, dot(n, normalize(uLightDir)));
        float mare = smoothstep(0.60, 0.94, hash(floor(sp * 8.0))) * 0.32;
        vec3 base = mix(vec3(0.50, 0.49, 0.47), vec3(0.27, 0.27, 0.29), mare);
        base += hash(floor(sp * 44.0)) * 0.085 - 0.042;
        gl_FragColor = vec4(base * (0.05 + 0.95 * lit), 1.0);
      }`
  });
  moonMesh = new THREE.Mesh(new THREE.SphereGeometry(R * CFG.moonRadius, 56, 40), mat);
  /* 起始位于右下方，且落在相机后方之外，保证一进页面就能看到 */
  const a = 0.55;
  moonMesh.position.set(
    R * CFG.moonDist * Math.sin(a),
    -R * 0.55,
    -R * CFG.moonDist * Math.cos(a)
  );
  moonPivot.add(moonMesh);
}

let sunRef = null;
function buildSun() {
  const p = SUN_DIR.clone().multiplyScalar(SUN_DIST);
  const core = new THREE.Mesh(new THREE.SphereGeometry(SUN_RADIUS, 32, 32),
                              new THREE.MeshBasicMaterial({ color: 0xfff4dd }));

  sunRef = { core, glow };
}

let starfield = null;
function buildStarfield() {
  const COUNT = 4500;
  const pos = new Float32Array(COUNT * 3), col = new Float32Array(COUNT * 3);
  const siz = new Float32Array(COUNT), pha = new Float32Array(COUNT);
  const c = new THREE.Color();
  for (let i = 0; i < COUNT; i++) {
    const r = 60 + Math.pow(Math.random(), 0.6) * 700;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    pos[i * 3]     = r * Math.sin(phi) * Math.cos(theta);
    pos[i * 3 + 1] = r * Math.cos(phi);
    pos[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
    c.setHSL(Math.random(), 0.60, 0.14 + Math.random() * 0.20);
    col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
    siz[i] = 0.7 + Math.random() * 2.0;
    pha[i] = Math.random() * Math.PI * 2;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('aColor',   new THREE.BufferAttribute(col, 3));
  g.setAttribute('size',     new THREE.BufferAttribute(siz, 1));
  g.setAttribute('phase',    new THREE.BufferAttribute(pha, 1));
  const m = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 }, uPixelRatio: { value: renderer.getPixelRatio() } },
    vertexShader: `
      attribute float size; attribute float phase; attribute vec3 aColor;
      uniform float uTime, uPixelRatio;
      varying vec3 vColor; varying float vAlpha;
      void main() {
        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
        vColor = aColor;
        vAlpha = 0.35 + 0.55 * (0.5 + 0.5 * sin(uTime * 0.85 + phase));
        gl_PointSize = size * uPixelRatio * (18.0 / -mvPosition.z);
        gl_Position  = projectionMatrix * mvPosition;
      }`,
    fragmentShader: `
      varying vec3 vColor; varying float vAlpha;
      void main() {
        vec2 uv = gl_PointCoord - 0.5; float d2 = dot(uv, uv);
        if (d2 > 0.25) discard;
        gl_FragColor = vec4(vColor, smoothstep(0.25, 0.0, d2) * vAlpha);
      }`,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
  });
  starfield = new THREE.Points(g, m);
  scene.add(starfield);
}

const ringEl = $('ring');
function ringRadiusPx() {
  return Math.min(window.innerWidth, window.innerHeight) * CFG.ringRatio;

function earthRadiusPx() {
  const d = camera.position.distanceTo(controls.target);
  const ang = Math.asin(Math.min(0.9995, CFG.radius / Math.max(CFG.radius, d)));
  return Math.tan(ang) / Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2) * (window.innerHeight / 2);

/* ── 城市标签投影：只在面向相机 + 夜侧时浮现，并做防重叠剔除 ── */
const _cw = new THREE.Vector3(), _cn = new THREE.Vector3();
const _cc = new THREE.Vector3(), _cp = new THREE.Vector3();
const _taken = [];
function updateCityLabels() {
  if (!cityMarks.length) return;
  const W = window.innerWidth, H = window.innerHeight;
  const cand = [];
  for (const m of cityMarks) {
    _cw.copy(m.local).applyMatrix4(spinner.matrixWorld);
    _cn.copy(_cw).normalize();
    _cc.copy(camera.position).sub(_cw).normalize();
    const facing = _cn.dot(_cc);
    const night  = 1 - THREE.MathUtils.smoothstep(_cn.dot(SUN_DIR), -0.12, 0.40);
    if (facing < 0.14 || night < 0.30) { m.el.classList.remove('on'); continue; }
    _cp.copy(_cw).project(camera);
    if (_cp.z > 1) { m.el.classList.remove('on'); continue; }
    cand.push({ m, x: (_cp.x * 0.5 + 0.5) * W, y: (-_cp.y * 0.5 + 0.5) * H, s: facing * night });
  }
  cand.sort((a, b) => b.s - a.s);
  _taken.length = 0;
  for (const c of cand) {
    let clash = false;
    for (const t of _taken) {
      const dx = c.x - t.x, dy = c.y - t.y;
      if (dx * dx + dy * dy < 38 * 38) { clash = true; break; }
    }
    if (clash) { c.m.el.classList.remove('on'); continue; }
    _taken.push(c);
    c.m.el.style.transform =
      'translate(-50%,-50%) translate(' + c.x.toFixed(1) + 'px,' + (c.y - 12).toFixed(1) + 'px)';
    c.m.el.classList.add('on');
  }
}

const clock = new THREE.Clock();
let spinY = 0, uiTick = 0;
/* 手势控制累积旋转：手往哪移，地球就同向转到哪 */
let gestYaw = 0, gestPitch = 0;
/* 手势识别相关变量（提前声明，避免 animate 首帧 TDZ） */
const camv = $('camv');
const gestBubbleEl = $('gest-bubble');
const gestIcoEl = $('gest-ico');
let handOn = false, handModel = null, handDelegate = 'GPU';
let prevCX = null, prevCY = null, prevArea = null;
let handPresent = false, handGesture = 'none';
let lastStatus = '';

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const t  = clock.getElapsedTime();
  controls.update();

  /* 固定朝向：地球不自转（取消自动旋转），仅保留用户手动拖动与手势控制视角 */
  spinner.rotation.y = spinY + gestYaw;
  tilt.rotation.x = gestPitch;

  surfMat.uniforms.uTime.value  = t;
  fogMat.uniforms.uTime.value   = t;
  mistMat.uniforms.uTime.value  = t;
  cityMat.uniforms.uTime.value  = t;

  if (starfield) { starfield.material.uniforms.uTime.value = t; starfield.rotation.y = t * 0.004; }
  if (sunRef) { const p = 1 + 0.035 * Math.sin(t * 1.1); sunRef.glow.scale.set(80 * p, 80 * p, 1); }

  /* 月球缓慢公转；转到离相机过近时收缩淡出，避免糊住画面 */
  if (moonPivot) {
    moonPivot.rotation.y += dt * CFG.moonSpeed;
    moonMesh.getWorldPosition(_cw);
    const dist = _cw.distanceTo(camera.position);
    const k = THREE.MathUtils.clamp((dist - 2.6) / 2.2, 0, 1);
    moonMesh.scale.setScalar(k);
    moonMesh.visible = k > 0.02;
  }

  /* UI 层每 2 帧刷新一次即可 */
  if ((uiTick++ & 1) === 0) {
    spinner.updateMatrixWorld(true);
    updateCityLabels();
    updateRing();
  }

  composer.render();
}
animate();

  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h; camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(w, h);
  composer.setSize(w, h); bloomPass.setSize(w, h);
  const pr = renderer.getPixelRatio();
  surfMat.uniforms.uPixelRatio.value  = pr;
  fogMat.uniforms.uPixelRatio.value   = pr;
  mistMat.uniforms.uPixelRatio.value  = pr;
  cityMat.uniforms.uPixelRatio.value  = pr;
  if (starfield) starfield.material.uniforms.uPixelRatio.value = pr;
  updateRing();
});

/* ── 手势识别（Google MediaPipe GestureRecognizer，官方 tasks-vision）
   最高星标/最权威手势识别方案：官方手势模型识别 7 种手势 + 置信度，
   远优于旧版手工判定手指伸展的方法 ── */
const GEST_WASM = './vendor/mediapipe/wasm';
const GEST_MODEL = './vendor/mediapipe/gesture_recognizer.task';
const GEST_LABELS = {
  Open_Palm: { name: '张开手掌' }, Closed_Fist: { name: '握拳' },
  Pointing_Up: { name: '食指上指' }, Thumb_Up: { name: '点赞' },
  Thumb_Down: { name: '拇指向下' }, Victory: { name: '剪刀手' },
  ILoveYou: { name: '我爱你' }
};
/* Twemoji 彩色 SVG 手势图标（来自 farewell 图标库收录的 jdecked/twemoji） */
const GEST_ICONS = {
  Open_Palm: '270b', Closed_Fist: '270a', Victory: '270c', Thumb_Up: '1f44d',
  Thumb_Down: '1f44e', Pointing_Up: '261d', ILoveYou: '1f91f'
};
const GEST_IDLE_ICON = '1f590'; // 🖐️ 张开手（未识别到手时显示）
const GEST_ICON_DIR = './vendor/gesture-icons/';
function setGestStatus(txt, cls) {
  const s = (cls || '') + '|' + txt;
  if (s === lastStatus) return;
  lastStatus = s;
  gestBubbleEl.classList.remove('ok', 'warn', 'idle', 'busy');
  if (cls) gestBubbleEl.classList.add(cls);
}
/* 注入 Twemoji SVG 图标（本地文件，直接 fetch 后嵌入，避免 emoji 字体丑陋） */
function setGestIcon(code) {
  const target = GEST_ICON_DIR + code + '.svg';
  fetch(target).then(r => r.ok ? r.text() : Promise.reject()).then(svg => {
    gestIcoEl.innerHTML = svg;
  }).catch(() => {});
}
/* 白色手势指示球：更新 SVG 图标 + 置信度弧光 + 弹出动画（华为 Mate 80 隔空手势风格） */
function updateGestBubble(gesture, conf) {
  if (gesture && gesture !== 'none' && gesture !== 'unknown') {
    setGestIcon(GEST_ICONS[gesture] || GEST_IDLE_ICON);
    const pct = Math.max(0, Math.min(1, conf || 0)) * 360;
    gestBubbleEl.style.setProperty('--arc', pct.toFixed(0) + 'deg');
    gestBubbleEl.classList.remove('idle', 'busy');
    gestBubbleEl.classList.add('ok', 'pop');
  } else {
    setGestIcon(GEST_IDLE_ICON);
    gestBubbleEl.style.setProperty('--arc', '0deg');
    gestBubbleEl.classList.remove('ok', 'busy');
    gestBubbleEl.classList.add('idle', 'pop');
  }
}
function onGestureResult(res) {
  const g = res.gestures && res.gestures[0] && res.gestures[0][0];
  const lm = res.landmarks && res.landmarks[0];
  if (!g || !lm) {
    handPresent = false; handGesture = 'none';
    prevCX = prevCY = prevArea = null;
    setGestStatus('idle', 'idle');
    updateGestBubble(null, 0);
    return;
  }
  handPresent = true;
  handGesture = g.categoryName || 'unknown';
  const conf = (g.score || 0) * 100;
  const label = GEST_LABELS[handGesture] || { name: handGesture, ico: '🫱' };
  setGestStatus(label.name + ' ' + conf.toFixed(0) + '%', 'ok');
  updateGestBubble(handGesture, g.score || 0);

  /* 手掌中心：0=腕, 5/9/13/17=指根，平均 → 旋转控制基准 */
  const base = [0, 5, 9, 13, 17];
  let cx = 0, cy = 0;
  for (const i of base) { cx += lm[i].x; cy += lm[i].y; }
  cx /= base.length; cy /= base.length;
  const p0 = lm[0], p9 = lm[9];
  const area = Math.hypot(p0.x - p9.x, p0.y - p9.y);

  /* 张开手掌 = 拖动旋转 + 推拉缩放 */
  if ((handGesture === 'Open_Palm') && prevCX !== null) {
    const dx = cx - prevCX;   // 手右移 → 画面 x 减小（前置流镜像）
    const dy = cy - prevCY;   // 手下移 → y 增大
    if (Math.abs(dx) > 0.007 || Math.abs(dy) > 0.007) {
      gestYaw   += dx * 3.2;
      gestPitch -= dy * 3.2;
      gestPitch = THREE.MathUtils.clamp(gestPitch, -1.25, 1.25);
    }
    if (prevArea !== null) {
      const da = area - prevArea;
      if (Math.abs(da) > 0.015) {
        const dist = camera.position.distanceTo(controls.target);
        const nd = THREE.MathUtils.clamp(dist * (1 - da * 8), controls.minDistance, controls.maxDistance);
        camera.position.sub(controls.target).multiplyScalar(nd / dist).add(controls.target);
      }
    }
  }
  prevCX = cx; prevCY = cy; prevArea = area;
}
async function enableHands() {
  if (handOn) return;
  handOn = true;
  try {
    /* 本地 FilesetResolver 加载 WASM（已随仓库部署，无需 CDN） */
    const fileset = await FilesetResolver.forVisionTasks(GEST_WASM);
    handModel = await GestureRecognizer.createFromOptions(
      fileset, {
        baseOptions: { modelAssetPath: GEST_MODEL, delegate: handDelegate },
        runningMode: 'VIDEO',
        numHands: 1,
        minHandDetectionConfidence: 0.5,
        minHandPresenceConfidence: 0.5,
        minTrackingConfidence: 0.5
      }
    );
    /* 原生摄像头启动（兼容手机浏览器） */
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { width: 320, height: 240, facingMode: 'user' }, audio: false
    });
    camv.srcObject = stream;
    await camv.play().catch(() => {});
    setGestStatus('ready', 'ok');
    updateGestBubble(null, 0);
    /* 循环送帧识别（VIDEO 模式需时间戳） */
    let sending = false, lastVideoTime = -1;
    const loop = async () => {
      if (!handOn) return;
      if (camv.readyState >= 2 && !sending && camv.currentTime !== lastVideoTime) {
        sending = true;
        try {
          lastVideoTime = camv.currentTime;
          const res = handModel.recognizeForVideo(camv, performance.now());
          onGestureResult(res);
        } catch (e) {}
        sending = false;
      }
      requestAnimationFrame(loop);
    };
    loop();
    console.log('[Hands] GestureRecognizer 已启动 (' + handDelegate + ')');
  } catch (e) {
    console.warn('[Hands] 手势启动失败', e);
    /* GPU 失败自动降级 CPU 重试（手机 WebGL 不支持 GPU delegate 常见） */
    if (handDelegate === 'GPU') {
      if (handModel && handModel.close) { try { handModel.close(); } catch (e2) {} }
      handModel = null;
      handDelegate = 'CPU';
      handOn = false;
      setGestStatus('cpu', 'warn');
      updateGestBubble(null, 0);
      setTimeout(() => { if (!handOn) enableHands(); }, 300);
      return;
    }
    handOn = false;
    if (handModel && handModel.close) { try { handModel.close(); } catch (e2) {} handModel = null; }
    const msg = (e && e.message) ? e.message : String(e);
    setGestStatus('err', 'warn');
    updateGestBubble(null, 0);
    console.warn('[Hands] 手势启动失败:', msg);
    const retry = () => {
      window.removeEventListener('pointerdown', retry);
      window.removeEventListener('touchstart', retry);
      window.removeEventListener('keydown', retry);
      enableHands();
    };
    window.addEventListener('pointerdown', retry, { once: true });
    window.addEventListener('touchstart', retry, { once: true });
    window.addEventListener('keydown', retry, { once: true });
  }
}

/* 备用判定：d3.geoContains（真实球面几何，单次约 39ms）。
   注意：world-atlas 的 land-10m 环缠绕方向与 d3 的球面约定不一致，
   实测 geoContains 会把大西洋/几内亚湾/南太平洋也判成陆地（恒为 true），
   因此主判定必须用上面的光栅化查表；此函数仅用于人工对照调试。 */
window.__geoContains = (lon, lat) => (landGeoRef ? d3.geoContains(landGeoRef, [lon, lat]) : null);
window.__isLandAt = (lon, lat) => (landTable ? isLandAt(landTable, lon, lat) : null);
</script>
