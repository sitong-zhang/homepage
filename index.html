<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

<script type="module">
import * as THREE from 'three';
import { OrbitControls }   from 'three/addons/controls/OrbitControls.js';
import { EffectComposer }  from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }      from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass }      from 'three/addons/postprocessing/OutputPass.js';
import { FilesetResolver, GestureRecognizer } from '@mediapipe/tasks-vision';

const CFG = {
  radius        : 2.0,
  targetSamples : 200000,
  oceanKeep     : 0.02,
  fogCount      : 45000,    // Interior fog volume (Normal blending, fills the interior)
  mistCount     : 60000,   // Interior glow mist (Additive)
  moonRadius    : 0.26,     // Moon radius (×R)
  moonDist      : 3.4,      // Moon orbit radius (×R)
  moonSpeed     : 0.012,    // Orbital angular velocity in rad/s (very slow)
  cityPer       : 46,       // Number of light points per city
  citySpread    : 0.052     // City light spread radius (×R)
};

const SUN_DIR    = new THREE.Vector3(0.60, 0.28, 0.75).normalize();
const SUN_DIST   = 260;
const SUN_RADIUS = 8;
const TILT       = THREE.MathUtils.degToRad(23.5);

const $ = (id) => document.getElementById(id);
const frame = () => new Promise(r => requestAnimationFrame(r));
const setProgress = (t) => { $('progress').textContent = t; };
const setBar = (p) => { document.querySelector('#bar i').style.width = (Math.max(0, Math.min(1, p)) * 100).toFixed(1) + '%'; };
const setNote = (html) => { const n = $('note'); n.innerHTML = html; n.classList.add('on'); };

if (location.protocol === 'file:') {
  setNote('Detected <b>file://</b> protocol: the browser will block local data requests and the page will stay stuck loading.<br>' +
          'Please open via a local server (<b>python3 -m http.server 8000</b>) or deploy to static hosting.');
}

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
} catch (e) {
  setNote('WebGL initialization failed: the current browser/device does not support WebGL.');
  throw e;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.92;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000206);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 4000);
camera.position.set(0, 1.6, 6.8);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.rotateSpeed = 0.65;
controls.zoomSpeed = 0.8;
controls.minDistance = 3.2;
controls.maxDistance = 24;
controls.enablePan = false;
controls.target.set(0, 0, 0);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  0.34, 0.50, 0.74
);
composer.addPass(bloomPass);
composer.addPass(new OutputPass());

const LAND_BYTES = 3086715;
const SOURCES = [
  './vendor/land-10m.json',
  './vendor/land-110m.json'
];

async function fetchLand(url) {
  const ctrl = new AbortController();
  const kill = setTimeout(() => ctrl.abort(), 10000);
  let res;
  try {
    res = await fetch(url, { signal: ctrl.signal });
  } finally { clearTimeout(kill); }
  if (!res.ok) throw new Error('HTTP ' + res.status);

  const reader = res.body.getReader();
  const chunks = []; let received = 0, lastTick = Date.now();
  const stall = setInterval(() => {
    if (Date.now() - lastTick > 4000) { try { reader.cancel(); } catch (e) {} }
  }, 500);
  try {
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value); received += value.length; lastTick = Date.now();
      const p = Math.min(1, received / LAND_BYTES);
      setBar(0.02 + 0.68 * p);
      setProgress('Downloading land data… ' + Math.round(p * 100) + '%');
    }
  } finally { clearInterval(stall); }
  if (received < 200000) throw new Error('Incomplete download: ' + received);
  return JSON.parse(await new Blob(chunks).text());
}

async function loadLandGeoJSON() {
  for (const url of SOURCES) {
    for (let attempt = 0; attempt < 2; attempt++) {
      try {
        setProgress(attempt ? 'Network stalled, retrying…' : 'Connecting to data source…'); setBar(0.01);
        const topo = await fetchLand(url);
        setProgress('Parsing land data…'); setBar(0.72); await frame();
        const land = topojson.feature(topo, topo.objects.land || Object.values(topo.objects)[0]);
        setBar(0.78);
        console.log('[Earth] Land data loaded:', url);
        return { land, url };
      } catch (e) {
        console.warn('[Earth] Source failed:', url, e);
        if (attempt === 0) { setProgress('Connection interrupted, retrying…'); await new Promise(r => setTimeout(r, 800)); }
      }
    }
  }
  return null;
}

function rasterizeLand(landGeo) {
  const W = 2048, H = 1024;
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d', { willReadFrequently: true });
  ctx.fillStyle = '#ff0000';

  const geoms = landGeo.type === 'FeatureCollection' ? landGeo.features.map(f => f.geometry)
              : landGeo.type === 'Feature' ? [landGeo.geometry]
              : [landGeo];

  for (const g of geoms) {
    const polys = g.type === 'Polygon' ? [g.coordinates]
                : g.type === 'MultiPolygon' ? g.coordinates : [];
    for (const poly of polys) {
      for (const ring of poly) {
        const segs = []; let cur = [];
        for (let k = 0; k < ring.length; k++) {
          if (k > 0) {
            const q = ring[k - 1], p = ring[k];
            const dl = p[0] - q[0];
            if (Math.abs(dl) > 180) {
              const t = (180 - Math.abs(q[0])) / Math.abs(dl);
              const li = q[1] + (p[1] - q[1]) * t;
              const eg = q[0] > 0 ? 180 : -180;
              cur.push([eg, li]); segs.push(cur); cur = [[-eg, li]];
            }
          }
          cur.push(ring[k]);
        }
        if (cur.length) segs.push(cur);

        for (const seg of segs) {
          if (seg.length < 3) continue;
          ctx.beginPath();
          for (let k = 0; k < seg.length; k++) {
            const x = (seg[k][0] + 180) / 360 * W;
            const y = (90 - seg[k][1]) / 180 * H;
            k === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
          }
          ctx.closePath();
          ctx.fill('evenodd');
        }
      }
    }
  }
  return { data: ctx.getImageData(0, 0, W, H).data, W, H };
}

function isLandAt(t, lon, lat) {
  let x = Math.floor((lon + 180) / 360 * t.W); if (x < 0) x = 0; if (x >= t.W) x = t.W - 1;
  let y = Math.floor((90 - lat) / 180 * t.H);  if (y < 0) y = 0; if (y >= t.H) y = t.H - 1;
  return t.data[(y * t.W + x) * 4 + 3] > 40;
}

function fibSphere(i, n) {
  const y = 1 - (i / (n - 1)) * 2;
  const r = Math.sqrt(Math.max(0, 1 - y * y));
  const theta = i * Math.PI * (3 - Math.sqrt(5));
  return [Math.cos(theta) * r, y, Math.sin(theta) * r];
}
function toLonLat(x, y, z) {
  const len = Math.sqrt(x * x + y * y + z * z) || 1;
  const lon = Math.atan2(z / len, x / len) * 180 / Math.PI;
  const lat = Math.asin(Math.max(-1, Math.min(1, y / len))) * 180 / Math.PI;
  return [lon, lat];
}

let baseHSL = { h: 0, s: 0, l: 0 };
new THREE.Color('#3aa8ff').getHSL(baseHSL);
const _c = new THREE.Color();

/* Land: uniform small white dots (do not vary with latitude, uniform across all land) */
function landColor() {
  return _c.setHSL(0, 0, 0.92);
}
function oceanColor() {
  return _c.setHSL((baseHSL.h + 0.03) % 1, 0.85, 0.22);
}

const VERT = `
  attribute float size;
  attribute vec3  aColor;
  attribute float aSeg;      // Bone segment index 0..22
  attribute float aT;        // Position within the segment, 0..1 (finger base -> tip)
  attribute float aAngle;    // Angle around the bone axis, 0..1
  attribute float aRadius;   // Radius ratio from the bone axis, 0..1
  uniform float uPixelRatio, uSizeScale;
  uniform vec3  uLightDir;
  uniform float uEmissive;
  uniform float uMorph;      // 0=globe  1=hand
  uniform vec3  uJoints[22]; // 21 hand landmarks + 1 virtual palm point
  uniform float uSegA[23];   // Start landmark index of each segment
  uniform float uSegB[23];   // End landmark index of each segment
  uniform float uSegR[23];   // Radius of each segment
  varying vec3  vColor;
  void main() {
    int si = int(aSeg);
    vec3 handPos;
    if (si == 21) {
      /* -- Palm ellipse disc (v12 3D-ified: recessed center + raised palm rim -> a solid palm hollow) --
           A real palm is concave at the center and bulges along its rim. Approximated with a "radial
           quadratic depression": z dips where aRadius is small and bulges where it is large -> hollow */
      vec3 C = uJoints[21];
      float ang2 = aAngle * 6.28318;
      float r2   = aRadius * uSegR[21];
      /* Ellipse: x axis ×1.15 slightly wider, y axis ×0.80 slightly narrower -> horizontal palm feel */
      float ex = cos(ang2) * r2 * 1.15;
      float ey = sin(ang2) * r2 * 0.80;
      /* Deeper palm hollow: z first dips then bulges along the radius (concave center, raised edge), thickness ×1.25 */
      float bowl = 0.60 * aRadius - 0.20 * (1.0 - aRadius) * (1.0 - aRadius);
      float zT = ((aT - 0.5) * 1.1 - bowl) * uSegR[21] * 0.9;
      handPos = C + vec3(ex, ey, zT);
    } else {
      vec3 A = uJoints[int(uSegA[si])];
      vec3 B = uJoints[int(uSegB[si])];
      vec3 axis = B - A;
      float len = length(axis);
      vec3 dir = axis / max(len, 0.0001);
      vec3 up = abs(dir.y) < 0.99 ? vec3(0.0,1.0,0.0) : vec3(1.0,0.0,0.0);
      vec3 side = normalize(cross(dir, up));
      vec3 up2 = cross(side, dir);
      float ang = aAngle * 6.28318;
      /* -- Three-lobe finger profile: "narrowed knuckles + slightly bulging pads" (v12 3D-ified) --
         Real finger structure: finger base -> first joint (knuckle) -> pad -> second joint -> tip
         Modeled with a continuous polynomial (kept legal: only + - * / and sin, no complex branching):
         f(t) = 1.0 + A*t*(B - C*t) - D*sin(π*(t-ε))
         t=0 (base) f=1.0; t~0.35 joint narrows; t~0.55 pad bulges; t~0.80 second joint narrows; t=1 blunt tip
         Unlike v10's monotonic taper, this profile undulates several times, visibly "jointed" */
      float pinch = 0.16 * sin(3.14159 * (aT - 0.03));
      float taper = 1.0 + aT * (0.06 - 0.40 * aT) - pinch;
      vec3 off = (cos(ang)*side + sin(ang)*up2) * (aRadius * uSegR[si] * taper);
      handPos = A + dir * (aT * len) + off;
    }

    vec3 morphed = mix(position, handPos, uMorph);

    vec4 mvPosition = modelViewMatrix * vec4(morphed, 1.0);
    vec3 n = normalize(mat3(modelMatrix) * normalize(morphed));
    float sun = smoothstep(-0.08, 0.55, dot(n, uLightDir));
    vec3 nightC = vec3(0.07, 0.09, 0.15) + vec3(0.26, 0.34, 0.55) * uEmissive;
    vec3 tint = mix(nightC, vec3(1.0, 0.97, 0.92), sun);
    /* Hand form blends in a warm white glow to strengthen the transition */
    vec3 handC = vec3(0.98, 0.90, 0.80) + vec3(0.0, 0.02, 0.10) * aT;
    tint = mix(tint, handC, uMorph * 0.55);
    vColor = aColor * tint;
    /* Particles grow in hand form: v12 raises it from 0.9 to 1.3 so the hand looks denser and fuller (globe size kept) */
    gl_PointSize = size * (1.0 + uMorph * 1.3) * uSizeScale * uPixelRatio * (9.0 / -mvPosition.z);
    gl_Position  = projectionMatrix * mvPosition;
  }
`;
const FRAG = `
  varying vec3 vColor;
  uniform float uTime;
  void main() {
    vec2 uv = gl_PointCoord - 0.5;
    float d2 = dot(uv, uv);
    if (d2 > 0.25) discard;
    /* Solid small dot: sharp cutoff from center to edge to avoid a light-blob glow */
    float a = smoothstep(0.25, 0.18, d2);
    a *= 0.92 + 0.08 * sin(uTime * 1.8);
    gl_FragColor = vec4(vColor, a);
  }
`;
const FOG_FRAG = `
  varying vec3 vColor;
  uniform float uTime, uOpacity;
  void main() {
    vec2 uv = gl_PointCoord - 0.5;
    float d2 = dot(uv, uv);
    if (d2 > 0.25) discard;
    float a = smoothstep(0.25, 0.04, d2) * uOpacity;
    a *= 0.90 + 0.10 * sin(uTime * 1.8);
    gl_FragColor = vec4(vColor, a);
  }
`;
/* Vertex shader dedicated to the interior fog: flat color straight out, unaffected by lighting/night side, keeping it white */
const FOG_VERT = `
  attribute float size;
  attribute vec3  aColor;
  uniform float uPixelRatio, uSizeScale;
  varying vec3  vColor;
  void main() {
    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
    vColor = aColor;
    gl_PointSize = size * uSizeScale * uPixelRatio * (9.0 / -mvPosition.z);
    gl_Position  = projectionMatrix * mvPosition;
  }
`;

let landTable = null, landGeoRef = null;
let earthPoints = null, fogPoints = null, mistPoints = null;
let building = false;

const spinner = new THREE.Group();
const tilt    = new THREE.Group();
tilt.rotation.z = TILT;
tilt.add(spinner);
scene.add(tilt);

const surfMat = new THREE.ShaderMaterial({
  uniforms: { uPixelRatio:{value:renderer.getPixelRatio()}, uSizeScale:{value:1}, uTime:{value:0}, uLightDir:{value:SUN_DIR.clone()}, uEmissive:{value:0.85},
    uMorph:{value:0}, uJoints:{value:new Array(22).fill(0).map(() => new THREE.Vector3(0,0,0))},
    uSegA:{value:new Float32Array(23)}, uSegB:{value:new Float32Array(23)}, uSegR:{value:new Float32Array(23)} },
  vertexShader: VERT, fragmentShader: FRAG,
  transparent: true, depthWrite: true, depthTest: true, blending: THREE.NormalBlending
});
const fogMat = new THREE.ShaderMaterial({
  uniforms: { uPixelRatio:{value:renderer.getPixelRatio()}, uSizeScale:{value:1}, uTime:{value:0}, uLightDir:{value:SUN_DIR.clone()}, uOpacity:{value:0.16}, uEmissive:{value:0.0} },
  vertexShader: FOG_VERT, fragmentShader: FOG_FRAG,
  transparent: true, depthWrite: false, depthTest: true, blending: THREE.NormalBlending
});
const mistMat = new THREE.ShaderMaterial({
  uniforms: { uPixelRatio:{value:renderer.getPixelRatio()}, uSizeScale:{value:1}, uTime:{value:0}, uLightDir:{value:SUN_DIR.clone()}, uOpacity:{value:0.10}, uEmissive:{value:0.0} },
  vertexShader: FOG_VERT, fragmentShader: FOG_FRAG,
  transparent: true, depthWrite: false, depthTest: true, blending: THREE.AdditiveBlending
});
/* (The outer blue shield has been removed; the interior fog remains to provide volumetric depth) */

function makePoints(pos, col, siz, mat, extra) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('aColor',   new THREE.Float32BufferAttribute(col, 3));
  g.setAttribute('size',     new THREE.Float32BufferAttribute(siz, 1));
  if (extra) {
    g.setAttribute('aSeg',    new THREE.Float32BufferAttribute(extra.seg, 1));
    g.setAttribute('aT',      new THREE.Float32BufferAttribute(extra.t, 1));
    g.setAttribute('aAngle',  new THREE.Float32BufferAttribute(extra.angle, 1));
    g.setAttribute('aRadius', new THREE.Float32BufferAttribute(extra.radius, 1));
  }
  g.computeBoundingSphere();
  return new THREE.Points(g, mat);
}

/* -- Hand bone segments (MediaPipe 21 landmarks -> 22 segments: 20 finger bones + wrist + palm disc) --
   Each segment is [start landmark, end landmark, radius, weight]; the weight distributes particles by volume.
   Indices: 0=wrist 1-4=thumb 5-8=index 9-12=middle 13-16=ring 17-20=pinky, 21=virtual palm point
   Key improvement: every finger grows out of the "virtual palm point (21)" (a new [21, base] link),
   so finger bases sink into the palm disc -> fingers and palm form one solid body, no floating skeleton;
   finger radii are also thickened throughout, closer to a real hand */
const PALM_SEG = 21;   // Palm disc segment index (handled specially in the shader)
const HAND_SEGMENTS = [
  /* Thumb: palm -> thumb base (1), then along the thumb to the tip
     v12 3D-ified: every segment radius thickened by about 35%; the metacarpal segments ([21, base]) get
     an extra ×1.5 -> metacarpal bulge; the phalanx steps read more clearly (thick near, thin far) */
  [21,1,0.30,1.8],[1,2,0.26,1],[2,3,0.21,1],[3,4,0.17,1],
  /* Index finger */
  [21,5,0.45,1.8],[5,6,0.34,1],[6,7,0.28,1],[7,8,0.22,1],
  /* Middle finger */
  [21,9,0.45,1.8],[9,10,0.36,1],[10,11,0.30,1],[11,12,0.24,1],
  /* Ring finger */
  [21,13,0.42,1.8],[13,14,0.34,1],[14,15,0.28,1],[15,16,0.22,1],
  /* Pinky */
  [21,17,0.36,1.8],[17,18,0.28,1],[18,19,0.23,1],[19,20,0.18,1],
  /* Wrist -> palm */
  [0,21,0.45,1.2],
  /* Palm ellipse disc (special): a larger radius covers the finger bases; the raised weight keeps real palm volume */
  [21,21,1.25,6]
];
/* Precompute the particle distribution weight of each segment (weight × approximate segment volume) */
const HAND_SEG_WEIGHTS = (() => {
  const w = HAND_SEGMENTS.map(s => s[3]);
  const sum = w.reduce((a, b) => a + b, 0);
  let acc = 0;
  return w.map(x => { const v = acc; acc += x / sum; return v; }).concat([1]);
})();
function pickHandSegment() {
  const r = Math.random();
  for (let i = 0; i < HAND_SEGMENTS.length; i++) {
    if (r < HAND_SEG_WEIGHTS[i + 1]) return i;
  }
  return HAND_SEGMENTS.length - 1;
}
/* Initialize the shader uniforms uSegA/uSegB/uSegR */
(function initSegUniforms() {
  const A = surfMat.uniforms.uSegA.value, B = surfMat.uniforms.uSegB.value, R = surfMat.uniforms.uSegR.value;
  for (let i = 0; i < HAND_SEGMENTS.length; i++) {
    A[i] = HAND_SEGMENTS[i][0]; B[i] = HAND_SEGMENTS[i][1]; R[i] = HAND_SEGMENTS[i][2];
  }
})();

function buildInterior() {
  const R = CFG.radius, col = new THREE.Color();
  const fPos = [], fCol = [], fSiz = [], mPos = [], mCol = [], mSiz = [];
  const rnd = () => {
    const u = Math.random() * 2 - 1, th = Math.random() * Math.PI * 2;
    const rr = Math.sqrt(Math.max(0, 1 - u * u));
    return [rr * Math.cos(th), u, rr * Math.sin(th)];
  };
  /* Fill from near the sphere center all the way to just below the surface, keeping the interior clearly white */
  for (let j = 0; j < CFG.fogCount; j++) {
    const [dx, dy, dz] = rnd();
    const r = R * (0.16 + 0.82 * Math.cbrt(Math.random()));
    fPos.push(dx * r, dy * r, dz * r);
    /* Interior fog: pure white (saturation 0), bright enough to cover the blue base */
    col.setHSL(0, 0, 0.20 + Math.random() * 0.06);
    fCol.push(col.r, col.g, col.b);
    fSiz.push(1.20 + Math.random() * 0.80);
  }
  for (let j = 0; j < CFG.mistCount; j++) {
    const [dx, dy, dz] = rnd();
    const r = R * (0.20 + 0.79 * Math.cbrt(Math.random()));
    mPos.push(dx * r, dy * r, dz * r);
    /* Interior glow mist: pure white, slightly dimmer for layering */
    col.setHSL(0, 0, 0.12 + Math.random() * 0.05);
    mCol.push(col.r, col.g, col.b);
    mSiz.push(1.00 + Math.random() * 0.70);
  }
  if (fogPoints)  { spinner.remove(fogPoints);  fogPoints.geometry.dispose(); }
  if (mistPoints) { spinner.remove(mistPoints); mistPoints.geometry.dispose(); }
  fogPoints  = makePoints(fPos, fCol, fSiz, fogMat);
  mistPoints = makePoints(mPos, mCol, mSiz, mistMat);
  spinner.add(fogPoints); spinner.add(mistPoints);
}

async function buildSurface(N) {
  if (building || !landTable) return 0;
  building = true;
  const R = CFG.radius;
  const pos = [], col = [], siz = [];
  const seg = [], tarr = [], angarr = [], radarr = [];
  let landCount = 0, oceanCount = 0;

  for (let i = 0; i < N; i++) {
    if (i % 20000 === 0) {
      setProgress('Sampling land particles… ' + Math.round(i / N * 100) + '%');
      setBar(0.9 + 0.1 * (i / N));
      await frame();
    }
    const [x, y, z] = fibSphere(i, N);
    const [lon, lat] = toLonLat(x, y, z);
    const isLand = isLandAt(landTable, lon, lat);

    if (!isLand && Math.random() > CFG.oceanKeep) continue;
    isLand ? landCount++ : oceanCount++;

    /* Land and ocean sit at the same spherical height (fixed radius, no random jitter), flush with each other */
    const rr = R * (isLand ? 1.006 : 1.0);
    pos.push(x * rr, y * rr, z * rr);

    const c = isLand ? landColor() : oceanColor();
    col.push(c.r, c.g, c.b);
    /* Land: uniformly sized small dots; ocean: smaller and slightly random */
    siz.push(isLand ? 0.50 : 0.28 + Math.random() * 0.14);

    /* Hand bone assignment: randomly assign to some bone segment, generating cylinder sampling parameters */
    seg.push(pickHandSegment());
    tarr.push(Math.random());
    angarr.push(Math.random());
    radarr.push(Math.sqrt(Math.random())); // Uniform in area so particles fill the whole cross-section
  }

  if (earthPoints) { spinner.remove(earthPoints); earthPoints.geometry.dispose(); }
  earthPoints = makePoints(pos, col, siz, surfMat, { seg, t: tarr, angle: angarr, radius: radarr });
  spinner.add(earthPoints);

  console.log('[Earth] Sampled ' + N + ' points · land ' + landCount + ' · ocean ' + oceanCount + ' · final ' + pos.length / 3 + ' particles');
  building = false;
  return pos.length / 3;
}

/* Longitude/latitude -> local sphere coordinates (strictly inverse of toLonLat) */
function lonLatToVec(lat, lon, r) {
  const la = lat * Math.PI / 180, lo = lon * Math.PI / 180;
  return new THREE.Vector3(
    r * Math.cos(la) * Math.cos(lo),
    r * Math.sin(la),
    r * Math.cos(la) * Math.sin(lo)
  );
}

const CITY_VERT = `
  attribute float size;
  attribute vec3  aColor;
  attribute float phase;
  uniform float uPixelRatio, uSizeScale, uTime;
  uniform vec3  uLightDir;
  varying vec3  vColor; varying float vA;
  void main() {
    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
    vec3 n = normalize(mat3(modelMatrix) * normalize(position));
    float sun   = smoothstep(-0.12, 0.40, dot(n, uLightDir));
    float night = 1.0 - sun;
    float tw    = 0.80 + 0.20 * sin(uTime * 1.7 + phase * 6.2831);
    vColor = aColor;
    vA = pow(night, 1.30) * tw;
    gl_PointSize = size * uSizeScale * uPixelRatio * (9.0 / -mvPosition.z);
    gl_Position  = projectionMatrix * mvPosition;
  }`;
const CITY_FRAG = `
  varying vec3 vColor; varying float vA;
  void main() {
    vec2 uv = gl_PointCoord - 0.5;
    float d2 = dot(uv, uv);
    if (d2 > 0.25) discard;
    float a = smoothstep(0.25, 0.03, d2) * vA;
    if (a < 0.004) discard;
    gl_FragColor = vec4(vColor, a);
  }`;

const cityMat = new THREE.ShaderMaterial({
  uniforms: { uPixelRatio:{value:renderer.getPixelRatio()}, uSizeScale:{value:1},
              uTime:{value:0}, uLightDir:{value:SUN_DIR.clone()} },
  vertexShader: CITY_VERT, fragmentShader: CITY_FRAG,
  transparent: true, depthWrite: false, depthTest: true, blending: THREE.AdditiveBlending
});

let cityPoints = null;
const cityMarks = [];          // { name, local:Vector3, el:HTMLElement }
const cityLayer = $('cities');

function buildCities() {
  const R = CFG.radius;
  const pos = [], col = [], siz = [], pha = [];
  const c = new THREE.Color();
  const Y = new THREE.Vector3(0, 1, 0);

  for (const [name, lat, lon] of CITIES) {
    const base = lonLatToVec(lat, lon, R * 1.012);
    /* Orthonormal basis of the tangent plane at that point */
    const n  = base.clone().normalize();
    const t1 = new THREE.Vector3().crossVectors(Y, n);
    if (t1.lengthSq() < 1e-6) t1.set(1, 0, 0);   // Degenerate at the poles
    t1.normalize();
    const t2 = new THREE.Vector3().crossVectors(n, t1).normalize();

    for (let k = 0; k < CFG.cityPer; k++) {
      /* Gaussian-like scatter: dense in the center, sparse at the outer edge */
      const ang = Math.random() * Math.PI * 2;
      const rad = Math.pow(Math.random(), 1.9) * CFG.citySpread * R;
      const p = base.clone()
        .addScaledVector(t1, Math.cos(ang) * rad)
        .addScaledVector(t2, Math.sin(ang) * rad);
      const L = R * 1.012 / p.length();
      p.multiplyScalar(L);
      pos.push(p.x, p.y, p.z);

      /* Neon green lights: the core leans bright green-white, the outer edge leans deep green */
      const w = Math.random();
      c.setHSL(0.33, 0.90 - w * 0.30, 0.58 + (1 - Math.random()) * 0.30);
      col.push(c.r, c.g, c.b);
      siz.push(0.70 + Math.random() * 0.95);
      pha.push(Math.random());
    }

    const el = document.createElement('div');
    el.className = 'city';
    el.textContent = name;
    cityLayer.appendChild(el);
    cityMarks.push({ name, local: base.clone(), el });
  }

  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('aColor',   new THREE.Float32BufferAttribute(col, 3));
  g.setAttribute('size',     new THREE.Float32BufferAttribute(siz, 1));
  g.setAttribute('phase',    new THREE.Float32BufferAttribute(pha, 1));
  g.computeBoundingSphere();
  if (cityPoints) { spinner.remove(cityPoints); cityPoints.geometry.dispose(); }
  cityPoints = new THREE.Points(g, cityMat);
  spinner.add(cityPoints);
}

let moonPivot = null, moonMesh = null;
function buildMoon() {
  const R = CFG.radius;
  moonPivot = new THREE.Group();
  moonPivot.rotation.x = THREE.MathUtils.degToRad(11);
  scene.add(moonPivot);

  const mat = new THREE.ShaderMaterial({
    uniforms: { uLightDir: { value: SUN_DIR.clone() } },
    vertexShader: `
      varying vec3 vN; varying vec3 vP;
      void main() {
        vN = normalize(mat3(modelMatrix) * normal);
        vP = position;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }`,
    fragmentShader: `
      uniform vec3 uLightDir; varying vec3 vN; varying vec3 vP;
      float hash(vec3 p) { return fract(sin(dot(p, vec3(12.9898, 78.233, 37.719))) * 43758.5453); }
      void main() {
        vec3 n = normalize(vN), sp = normalize(vP);
        float lit = smoothstep(-0.10, 0.72, dot(n, normalize(uLightDir)));
        float mare = smoothstep(0.60, 0.94, hash(floor(sp * 8.0))) * 0.32;
        vec3 base = mix(vec3(0.50, 0.49, 0.47), vec3(0.27, 0.27, 0.29), mare);
        base += hash(floor(sp * 44.0)) * 0.085 - 0.042;
        gl_FragColor = vec4(base * (0.05 + 0.95 * lit), 1.0);
      }`
  });
  moonMesh = new THREE.Mesh(new THREE.SphereGeometry(R * CFG.moonRadius, 56, 40), mat);
  /* Starts at the lower right and beyond the rear of the camera, so it is visible right after the page loads */
  const a = 0.55;
  moonMesh.position.set(
    R * CFG.moonDist * Math.sin(a),
    -R * 0.55,
    -R * CFG.moonDist * Math.cos(a)
  );
  moonPivot.add(moonMesh);
}

/* -- City label projection: surfaces only when facing the camera + on the night side, with anti-overlap culling -- */
const _cw = new THREE.Vector3(), _cn = new THREE.Vector3();
const _cc = new THREE.Vector3(), _cp = new THREE.Vector3();
const _taken = [];
function updateCityLabels() {
  if (!cityMarks.length) return;
  const W = window.innerWidth, H = window.innerHeight;
  const cand = [];
  for (const m of cityMarks) {
    _cw.copy(m.local).applyMatrix4(spinner.matrixWorld);
    _cn.copy(_cw).normalize();
    _cc.copy(camera.position).sub(_cw).normalize();
    const facing = _cn.dot(_cc);
    const night  = 1 - THREE.MathUtils.smoothstep(_cn.dot(SUN_DIR), -0.12, 0.40);
    if (facing < 0.14 || night < 0.30) { m.el.classList.remove('on'); continue; }
    _cp.copy(_cw).project(camera);
    if (_cp.z > 1) { m.el.classList.remove('on'); continue; }
    cand.push({ m, x: (_cp.x * 0.5 + 0.5) * W, y: (-_cp.y * 0.5 + 0.5) * H, s: facing * night });
  }
  cand.sort((a, b) => b.s - a.s);
  _taken.length = 0;
  for (const c of cand) {
    let clash = false;
    for (const t of _taken) {
      const dx = c.x - t.x, dy = c.y - t.y;
      if (dx * dx + dy * dy < 38 * 38) { clash = true; break; }
    }
    if (clash) { c.m.el.classList.remove('on'); continue; }
    _taken.push(c);
    c.m.el.style.transform =
      'translate(-50%,-50%) translate(' + c.x.toFixed(1) + 'px,' + (c.y - 12).toFixed(1) + 'px)';
    c.m.el.classList.add('on');
  }
}

    surfMat.uniforms.uTime.value  = t;
    fogMat.uniforms.uTime.value   = t;
    mistMat.uniforms.uTime.value  = t;
    cityMat.uniforms.uTime.value  = t;

    /* Hand morph: uMorph eases toward morphTarget (hand arrives -> dissolve into a hand, hand leaves -> flow back to the globe) */
    const curM = surfMat.uniforms.uMorph.value;
    const spd  = morphTarget > curM ? 3.2 : 2.2;   // Fast dissolve, slightly slower flow-back feels more natural
    surfMat.uniforms.uMorph.value = THREE.MathUtils.clamp(
      curM + (morphTarget - curM) * Math.min(1, dt * spd), 0, 1
    );

    if (starfield) { starfield.material.uniforms.uTime.value = t; starfield.rotation.y = t * 0.004; }
    if (sunRef) { const p = 1 + 0.035 * Math.sin(t * 1.1); sunRef.glow.scale.set(80 * p, 80 * p, 1); }

    /* The moon orbits slowly; when it comes too close to the camera it shrinks and fades so it does not blur the frame */
    if (moonPivot) {
      moonPivot.rotation.y += dt * CFG.moonSpeed;
      moonMesh.getWorldPosition(_cw);
      const dist = _cw.distanceTo(camera.position);
      const k = THREE.MathUtils.clamp((dist - 2.6) / 2.2, 0, 1);
      moonMesh.scale.setScalar(k);
      moonMesh.visible = k > 0.02;
    }

    /* The UI layer only needs to refresh once every 2 frames */
    if ((uiTick++ & 1) === 0) {
      spinner.updateMatrixWorld(true);
      updateCityLabels();
    }

    composer.render();
    /* Heartbeat record: refreshes the timestamp on every successful render for the watchdog to detect freezes/crashes */
    window.__lastRenderOk = Date.now();
  } catch (err) {
    /* Render loop fallback: an error in any frame must not leave the whole screen blank;
       log it once and try to rebuild the WebGL context (to cope with context lost) */
    if (!window.__renderErrShown) {
      window.__renderErrShown = true;
      console.error('[Render] Exception in render frame:', err);
      showFatalOverlay('An exception occurred during rendering; recovery was attempted. If the screen stays blank, click “Reload”.');
    }
  }
}
animate();

/* -- Fatal error fallback layer: shows a recoverable prompt on WebGL context lost / render errors instead of a blank white screen -- */
function showFatalOverlay(msg) {
  let o = document.getElementById('fatal-ov');
  if (!o) {
    o = document.createElement('div');
    o.id = 'fatal-ov';
    o.style.cssText = 'position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;' +
      'align-items:center;justify-content:center;background:rgba(0,2,8,.96);color:#cfe0ff;' +
      'font:14px/1.7 system-ui,-apple-system,sans-serif;text-align:center;padding:24px;';
    const t = document.createElement('div');
    t.textContent = '⚠️ ' + msg;
    t.style.marginBottom = '18px';
    const b = document.createElement('button');
    b.textContent = 'Reload';
    b.style.cssText = 'padding:10px 28px;font-size:15px;border:1px solid #4d72c8;background:#1a2747;' +
      'color:#eaf2ff;border-radius:8px;cursor:pointer;';
    b.onclick = () => location.reload();
    o.appendChild(t); o.appendChild(b);
    document.body.appendChild(o);
  }
}
/* WebGL context lost (common when mobile apps go to the background or memory is reclaimed) -> show a prompt instead of a white screen */
if (renderer && renderer.domElement) {
  renderer.domElement.addEventListener('webglcontextlost', (e) => {
    e.preventDefault();
    showFatalOverlay('The graphics rendering context was lost (common when switching apps or under memory pressure). Please reload.');
  });
  renderer.domElement.addEventListener('webglcontextrestored', () => {
    const o = document.getElementById('fatal-ov');
    if (o) o.style.display = 'none';
  });
}

window.addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h; camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(w, h);
  composer.setSize(w, h); bloomPass.setSize(w, h);
  const pr = renderer.getPixelRatio();
  surfMat.uniforms.uPixelRatio.value  = pr;
  fogMat.uniforms.uPixelRatio.value   = pr;
  mistMat.uniforms.uPixelRatio.value  = pr;
  cityMat.uniforms.uPixelRatio.value  = pr;
  if (starfield) starfield.material.uniforms.uPixelRatio.value = pr;
});

/* -- Gesture recognition (Google MediaPipe GestureRecognizer, official tasks-vision)
   Highest-starred / most authoritative solution: the official model recognizes 7 gestures + confidence,
   far superior to the old hand-rolled finger-extension heuristics -- */
const GEST_WASM = './vendor/mediapipe/wasm';
const GEST_MODEL = './vendor/mediapipe/gesture_recognizer.task';
const GEST_LABELS = {
  Open_Palm: { name: 'Open Palm' }, Closed_Fist: { name: 'Closed Fist' },
  Pointing_Up: { name: 'Pointing Up' }, Thumb_Up: { name: 'Thumbs Up' },
  Thumb_Down: { name: 'Thumbs Down' }, Victory: { name: 'Victory' },
  ILoveYou: { name: 'I Love You' }
};
/* Twemoji color SVG gesture icons (from jdecked/twemoji, collected in the farewell icon library) */
const GEST_ICONS = {
  Open_Palm: '270b', Closed_Fist: '270a', Victory: '270c', Thumb_Up: '1f44d',
  Thumb_Down: '1f44e', Pointing_Up: '261d', ILoveYou: '1f91f'
};
const GEST_IDLE_ICON = '1f590'; // 🖐️ Open hand (shown when no hand is recognized)
const GEST_ICON_DIR = './vendor/gesture-icons/';
function setGestStatus(txt, cls) {
  const s = (cls || '') + '|' + txt;
  if (s === lastStatus) return;
  lastStatus = s;
  gestBubbleEl.classList.remove('ok', 'warn', 'idle', 'busy');
  if (cls) gestBubbleEl.classList.add(cls);
}
/* Inject Twemoji SVG icons (local files, fetched and inlined to avoid ugly emoji fonts) */
function setGestIcon(code) {
  const target = GEST_ICON_DIR + code + '.svg';
  fetch(target).then(r => r.ok ? r.text() : Promise.reject()).then(svg => {
    gestIcoEl.innerHTML = svg;
  }).catch(() => {});
}
/* White gesture indicator bubble: updates the SVG icon + confidence arc + pop-out animation
   (Huawei Mate 80 air-gesture style). Gesture -> pops out; no gesture -> retracts to the top */
function updateGestBubble(gesture, conf) {
  if (gesture && gesture !== 'none' && gesture !== 'unknown') {
    setGestIcon(GEST_ICONS[gesture] || GEST_IDLE_ICON);
    const pct = Math.max(0, Math.min(1, conf || 0)) * 360;
    gestBubbleEl.style.setProperty('--arc', pct.toFixed(0) + 'deg');
    gestBubbleEl.classList.remove('idle', 'busy');
    gestBubbleEl.classList.add('ok', 'pop');
  } else {
    setGestIcon(GEST_IDLE_ICON);
    gestBubbleEl.style.setProperty('--arc', '0deg');
    gestBubbleEl.classList.remove('ok', 'busy', 'pop');   // Removing pop -> retracts
    gestBubbleEl.classList.add('idle');
  }
}
/* Convert the MediaPipe normalized hand landmarks -> world coordinates, written into the uJoints uniform.
   The hand is centered on the origin (where the globe is), faces the screen, and supports live tracking:
   - Normalizing by the actual wrist -> middle-finger-base distance keeps hand size stable (it does not
     change with how near or far the hand is); normalized x/y -> centered and enlarged world XY
   - z (MediaPipe relative depth) -> magnified and used as front-to-back layering
   - The anchor follows the hand's position in frame (level 2: slight translational follow) */
function updateHandJoints(lm) {
  const J = surfMat.uniforms.uJoints.value;
  /* Palm center anchor (follows the moving hand) */
  let ax = 0, ay = 0, az = 0;
  for (const i of [0, 5, 9, 13, 17]) { ax += lm[i].x; ay += lm[i].y; az += lm[i].z; }
  ax /= 5; ay /= 5; az /= 5;

  /* Scale reference: the wrist(0) -> middle finger base(9) distance, relatively stable across gestures */
  const wx = lm[9].x - lm[0].x, wy = lm[9].y - lm[0].y;
  const unitLen = Math.max(0.02, Math.hypot(wx, wy));
  /* Goal: this distance = HAND_PALM_LEN world units */
  const HAND_PALM_LEN = 1.4;
  const S = HAND_PALM_LEN / unitLen;

  for (let i = 0; i < 21; i++) {
    const p = lm[i];
    const x = (p.x - ax) * S;
    const y = (ay - p.y) * S;         // Flip MediaPipe's downward y -> world y upward
    const z = (az - p.z) * S * HAND_Z_SCALE;
    J[i].set(x, y, z);
  }

  /* Virtual palm point (21): the average of the four finger bases (5,9,13,17), i.e. the palm disc center */
  let px = 0, py = 0, pz = 0;
  for (const i of [5, 9, 13, 17]) { px += lm[i].x; py += lm[i].y; pz += lm[i].z; }
  px /= 4; py /= 4; pz /= 4;
  J[21].set(
    (px - ax) * S,
    (ay - py) * S,
    (pz - az) * S * HAND_Z_SCALE
   );
   /* -- Thumb base tweak (based on MANO anatomy): the thumb actually extends diagonally from the outer
      edge of the palm rather than growing straight out of its center. Shift J[1] (thumb base) 12% toward
      the wrist J[0] so the "palm -> thumb base" link runs diagonally, closer to a real hand -- */
   J[1].x = J[1].x * 0.88 + J[0].x * 0.12;
   J[1].y = J[1].y * 0.88 + J[0].y * 0.12;
   J[1].z = J[1].z * 0.88 + J[0].z * 0.12;
   /* Palm disc radius: scaled dynamically with the real finger size -- average distance from the four
      finger bases to the palm center ×1.35 -- palm size always matches finger size (natural proportions) */
  let pr = 0;
  for (const i of [5, 9, 13, 17]) {
    pr += Math.hypot(lm[i].x - px, lm[i].y - py);
  }
  pr = (pr / 4) * S * 1.8;
  surfMat.uniforms.uSegR.value[21] = Math.max(0.55, pr);
}
/* Whether to trigger the globe morph: any recognized gesture triggers it (open palm/fist/victory/thumbs up/
   pointing/thumbs down/I love you…); it flows back only when the hand fully leaves (!lm in onGestureResult) */
function isMorphGesture(g) {
  return !!g && g !== 'none' && g !== 'unknown' && g !== 'undefined';
}

function onGestureResult(res) {
  const g = res.gestures && res.gestures[0] && res.gestures[0][0];
  const lm = res.landmarks && res.landmarks[0];
  if (!lm) {
    handPresent = false; handGesture = 'none';
    prevCX = prevCY = prevArea = null;
    setGestStatus('idle', 'idle');
    updateGestBubble(null, 0);
    /* No hand: the white bubble retracts + the globe flows back to its original shape */
    morphTarget = 0;
    return;
  }
  /* Morphing starts as soon as hand landmarks exist, regardless of gesture category -- any pose is replicated */
  handPresent = true;
  handGesture = (g && g.categoryName) || 'unknown';
  const conf = (g ? g.score : 0) * 100;
  const label = GEST_LABELS[handGesture] || { name: 'Gesture', ico: '🖐️' };
  setGestStatus(label.name + ' ' + conf.toFixed(0) + '%', 'ok');
  updateGestBubble(handGesture, g ? g.score : 0);

  /* Update hand joint coordinates live (updated for every gesture so the hand tracks in real time) */
  updateHandJoints(lm);

  /* Hand present -> the globe dissolves into a hand (any gesture) */
  morphTarget = 1;

  /* Palm center: 0=wrist, 5/9/13/17=finger bases; their average is the rotation control reference */
  const base = [0, 5, 9, 13, 17];
  let cx = 0, cy = 0;
  for (const i of base) { cx += lm[i].x; cy += lm[i].y; }
  cx /= base.length; cy /= base.length;

  /* Gestures with confidence below 0.6 count as noise: accumulated offset is allowed, but no direct scaling */
  const confGate = (g && g.score) ? g.score : 0;
  const ctrlAllowed = confGate >= 0.6;

  /* Palm size EMA: the distance from wrist(0) to middle finger base(9), used for smooth scaling */
  const p0 = lm[0], p9 = lm[9];
  const area = Math.hypot(p0.x - p9.x, p0.y - p9.y);
  if (smoothArea === null) smoothArea = area;
  smoothArea = smoothArea * (1 - areaSmoothK) + area * areaSmoothK;

  /* Rotation control: only allowed when confidence >= 0.6 */
  if (prevCX !== null && prevCY !== null && ctrlAllowed) {
    const rawDX = cx - prevCX;
    const rawDY = cy - prevCY;
    const dead  = 0.018;
    let ddx = 0, ddy = 0;
    if (Math.abs(rawDX) > dead) ddx = rawDX > 0 ? rawDX - dead : rawDX + dead;
    if (Math.abs(rawDY) > dead) ddy = rawDY > 0 ? rawDY - dead : rawDY + dead;
    smoothDX = smoothDX * 0.7 + ddx * 0.3;
    smoothDY = smoothDY * 0.7 + ddy * 0.3;
    const K = 1.6;
    gestYaw   -= smoothDX * K;
    gestPitch -= smoothDY * K;
    gestPitch = THREE.MathUtils.clamp(gestPitch, -1.25, 1.25);
  }

  /* Zoom control: only allowed when confidence >= 0.75 and the EMA area is used (prevents jittery zooming) */
  if (ctrlAllowed && confGate >= 0.75) {
    if (prevArea !== null) {
      const da = smoothArea - prevArea;
      if (Math.abs(da) > 0.02) {
        const dist = camera.position.distanceTo(controls.target);
        const nd = THREE.MathUtils.clamp(dist * (1 - da * 4), controls.minDistance, controls.maxDistance);
        camera.position.sub(controls.target).multiplyScalar(nd / dist).add(controls.target);
      }
    }
  }
  prevCX = cx; prevCY = cy; prevArea = area;
}
async function enableHands() {
  if (handOn) return;
  handOn = true;
  try {
    /* Load WASM through the local FilesetResolver (shipped with the repo, no CDN needed) */
    const fileset = await FilesetResolver.forVisionTasks(GEST_WASM);
    handModel = await GestureRecognizer.createFromOptions(
      fileset, {
        baseOptions: { modelAssetPath: GEST_MODEL, delegate: handDelegate },
        runningMode: 'VIDEO',
        numHands: 1,
        minHandDetectionConfidence: 0.5,
        minHandPresenceConfidence: 0.5,
        minTrackingConfidence: 0.5
      }
    );
    /* Start the native camera (compatible with mobile browsers) */
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { width: 320, height: 240, facingMode: 'user' }, audio: false
    });
    camv.srcObject = stream;
    await camv.play().catch(() => {});
    setGestStatus('ready', 'ok');
    updateGestBubble(null, 0);
    hideCameraOverlay();
    /* Loop frames in for recognition (VIDEO mode requires timestamps) */
    let sending = false, lastVideoTime = -1;
    const loop = async () => {
      if (!handOn) return;
      if (camv.readyState >= 2 && !sending && camv.currentTime !== lastVideoTime) {
        sending = true;
        try {
          lastVideoTime = camv.currentTime;
          const res = handModel.recognizeForVideo(camv, performance.now());
          onGestureResult(res);
        } catch (e) {}
        sending = false;
      }
      requestAnimationFrame(loop);
    };
    loop();
    console.log('[Hands] GestureRecognizer started (' + handDelegate + ')');
  } catch (e) {
    console.warn('[Hands] Failed to start gestures', e);
    /* Automatically fall back to CPU and retry when GPU fails (mobile WebGL often lacks GPU delegate support) */
    if (handDelegate === 'GPU') {
      if (handModel && handModel.close) { try { handModel.close(); } catch (e2) {} }
      handModel = null;
      handDelegate = 'CPU';
      handOn = false;
      setGestStatus('cpu', 'warn');
      updateGestBubble(null, 0);
      setTimeout(() => { if (!handOn) enableHands(); }, 300);
      return;
    }
    handOn = false;
    if (handModel && handModel.close) { try { handModel.close(); } catch (e2) {} handModel = null; }
    const msg = (e && e.message) ? e.message : String(e);
    setGestStatus('err', 'warn');
    updateGestBubble(null, 0);
    console.warn('[Hands] Failed to start gestures:', msg);
    /* Visual prompt when the camera is denied / unavailable (the failure was hard to locate without feedback) */
    showCameraOverlay((e && e.name) ? e.name : msg);
    const retry = () => {
      window.removeEventListener('pointerdown', retry);
      window.removeEventListener('touchstart', retry);
      window.removeEventListener('keydown', retry);
      hideCameraOverlay();
      enableHands();
    };
    window.addEventListener('pointerdown', retry, { once: true });
    window.addEventListener('touchstart', retry, { once: true });
    window.addEventListener('keydown', retry, { once: true });
  }
}

/* -- Camera permission/availability prompt layer: shows clear guidance when the browser blocks getUserMedia, avoiding "silent failure" -- */
function showCameraOverlay(reason) {
  let o = document.getElementById('cam-ov');
  if (!o) {
    o = document.createElement('div');
    o.id = 'cam-ov';
    o.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:60;' +
      'max-width:90vw;padding:12px 18px;background:rgba(20,32,60,.94);border:1px solid rgba(110,150,230,.4);' +
      'border-radius:10px;color:#dce8ff;font:13px/1.6 system-ui,sans-serif;' +
      'box-shadow:0 6px 20px rgba(0,0,0,.4);';
    o.style.display = 'flex'; o.style.alignItems = 'center'; o.style.gap = '10px';
    const icon = document.createElement('span'); icon.textContent = '📷'; icon.style.fontSize = '18px';
    const txt = document.createElement('div');
    txt.innerHTML = '<b>Gesture recognition disabled</b>: camera permission was not granted.<br>' +
      'Please allow camera access in the browser address bar / permission settings, then click the button below to retry.';
    const btn = document.createElement('button');
    btn.textContent = 'Retry enabling gestures';
    btn.style.cssText = 'padding:8px 14px;border:1px solid #4d72c8;background:#1a2747;color:#eaf2ff;' +
      'border-radius:8px;cursor:pointer;white-space:nowrap;';
    btn.onclick = () => { hideCameraOverlay(); enableHands(); };
    o.appendChild(icon); o.appendChild(txt); o.appendChild(btn);
    document.body.appendChild(o);
  }
  o.style.display = 'flex';
}
function hideCameraOverlay() {
  const o = document.getElementById('cam-ov');
  if (o) o.style.display = 'none';
}

/* Fallback test: d3.geoContains (true spherical geometry, about 39ms per call).
   Note: the ring winding order of world-atlas land-10m disagrees with d3's spherical convention --
   geoContains in practice also judges the Atlantic / Gulf of Guinea / South Pacific as land (always true),
   so the main test must use the rasterized lookup above; this function is only for manual cross-check debugging. */
window.__geoContains = (lon, lat) => (landGeoRef ? d3.geoContains(landGeoRef, [lon, lat]) : null);
window.__isLandAt = (lon, lat) => (landTable ? isLandAt(landTable, lon, lat) : null);
</script>
