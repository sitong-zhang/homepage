<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ZJT 分发站</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg viewBox='0 0 48 48' xmlns='http://www.w3.org/2000/svg' style='width:100%;height:100%;display:block'%3E %3Cdefs%3E %3ClinearGradient id='lgA' x1='0' y1='0' x2='1' y2='1'%3E %3Cstop offset='0' stop-color='%232563eb'/%3E%3Cstop offset='.55' stop-color='%235b48e8'/%3E%3Cstop offset='1' stop-color='%237c3aed'/%3E %3C/linearGradient%3E %3ClinearGradient id='lgB' x1='0' y1='0' x2='0' y2='1'%3E %3Cstop offset='0' stop-color='%23ffffff' stop-opacity='.3'/%3E%3Cstop offset='1' stop-color='%23ffffff' stop-opacity='0'/%3E %3C/linearGradient%3E %3C/defs%3E %3Crect x='2' y='2' width='44' height='44' rx='13' fill='url(%23lgA)'/%3E %3Crect x='2' y='2' width='44' height='22' rx='13' fill='url(%23lgB)'/%3E %3Cg transform='translate(9.6,10.4) scale(1.2)'%3E%3Cpath fill='%23ffffff' d='m12 1.608 12 20.784H0Z'/%3E%3C/g%3E %3C/svg%3E">
<meta name="robots" content="noindex, nofollow">
<style>
:root{
  --bg:#0b1220; --bg2:#0f1a30; --card:#121e36; --card2:#16244a;
  --gold:#f5c542; --gold2:#ffdd7a; --line:#22335c; --txt:#e8eefc;
  --mut:#8ba0c9; --ok:#3ddc84; --err:#ff6b6b; --r:14px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:linear-gradient(160deg,var(--bg) 0%,var(--bg2) 60%,#0a0f1d 100%);color:var(--txt);
  font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;min-height:100dvh;}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 70px}
header{display:flex;align-items:center;gap:12px;padding:24px 0 16px}
.bellbtn{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;
  width:44px;height:44px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;color:var(--gold)}
.bellbtn .dot{position:absolute;top:-3px;right:-3px;width:10px;height:10px;border-radius:50%;
  background:var(--err);border:2px solid var(--bg);display:none}
.bellbtn .dot.on{display:block}
.logo{width:46px;height:46px;flex:0 0 auto;box-shadow:0 6px 18px rgba(29,78,216,.35)}
header h1{font-size:20px;font-weight:800;letter-spacing:.5px}
header .sub{font-size:12px;color:var(--mut);margin-top:3px}
.tabs{display:flex;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:6px;margin:14px 0 20px}
.tab{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:11px 6px;border-radius:10px;
  font-size:14px;font-weight:600;color:var(--mut);cursor:pointer;transition:.2s;border:none;background:none}
.tab svg{width:17px;height:17px}
.tab.on{background:linear-gradient(135deg,rgba(245,197,66,.16),rgba(245,197,66,.06));color:var(--gold);box-shadow:inset 0 0 0 1px rgba(245,197,66,.35)}
.view{display:none}.view.on{display:block}
/* ===== APK 卡片 ===== */
.apk{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px;display:flex;gap:14px;align-items:flex-start}
.apk .ic{width:56px;height:56px;border-radius:14px;flex:0 0 auto;background:linear-gradient(135deg,#1d4ed8,#7c3aed);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;color:#fff}
.apk h3{font-size:16px;font-weight:700}
.apk .meta{font-size:12px;color:var(--mut);margin:4px 0 8px}
.apk .log{font-size:12.5px;color:var(--mut);line-height:1.6;background:rgba(255,255,255,.03);border-radius:8px;padding:8px 10px;margin-bottom:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:linear-gradient(135deg,#f5c542,#e8a920);color:#1a1405;font-weight:700;font-size:14px;border:none;border-radius:10px;padding:11px 20px;cursor:pointer;text-decoration:none;transition:.15s}
.btn svg{width:15px;height:15px}
.btn:active{transform:scale(.97)}
.btn.ghost{background:none;color:var(--gold);border:1px solid rgba(245,197,66,.5)}
.empty{text-align:center;color:var(--mut);padding:36px 0;font-size:13.5px;line-height:1.9}
/* ===== 账户条 ===== */
.acct{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 14px;margin-bottom:14px;font-size:13px}
.acct .who{flex:1;color:var(--mut);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:7px}
.acct .who svg{width:15px;height:15px;flex:0 0 auto}
.acct .who b{color:var(--gold)}
.acct a{color:var(--gold);text-decoration:none;font-weight:600;font-size:12.5px;flex:0 0 auto;cursor:pointer;margin-left:10px}
/* ===== 上传 ===== */
.drop{border:2px dashed rgba(245,197,66,.45);border-radius:16px;background:rgba(245,197,66,.04);padding:34px 18px;text-align:center;cursor:pointer;transition:.2s}
.drop.on{background:rgba(245,197,66,.1);border-color:var(--gold)}
.drop .big{color:var(--gold);margin-bottom:10px}.drop .big svg{width:38px;height:38px}
.drop p{font-size:14.5px;font-weight:600}
.drop span{font-size:12px;color:var(--mut);display:block;margin-top:8px;line-height:1.7}
.targ{display:flex;gap:8px;margin:14px 0}
.tg{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--card);border:1px solid var(--line);color:var(--mut);border-radius:12px;padding:12px 10px;font-size:13.5px;font-weight:600;cursor:pointer;transition:.2s}
.tg svg{width:16px;height:16px}
.tg span{font-size:11px;font-weight:400;display:block}
.tg i{font-style:normal;font-size:11px;color:var(--mut);font-weight:400}
.tg.on{color:var(--gold);border-color:rgba(245,197,66,.55);background:rgba(245,197,66,.08);box-shadow:0 0 0 1px rgba(245,197,66,.15) inset}
/* ===== 网盘式文件列表 ===== */
.sechead{display:flex;align-items:center;gap:8px;margin:20px 0 12px}
.sechead h2{font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:7px}
.sechead h2 svg{width:16px;height:16px;color:var(--gold)}
.sechead .tag{font-size:10.5px;color:var(--mut);border:1px solid var(--line);border-radius:20px;padding:2px 8px}
.sechead a{margin-left:auto;color:var(--gold);font-size:12px;cursor:pointer;text-decoration:none;display:flex;align-items:center;gap:5px}
.sechead a svg{width:13px;height:13px}
.frow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.frow .fi{width:38px;height:38px;border-radius:10px;background:var(--card2);display:flex;align-items:center;justify-content:center;flex:0 0 auto;color:var(--gold2)}
.frow .fi svg{width:19px;height:19px}
.fmain{flex:1;min-width:0}
.fn{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fm{font-size:11.5px;color:var(--mut);margin-top:3px}
.fops{display:flex;gap:4px;flex:0 0 auto}
.icobtn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--card2);color:var(--mut);
  display:flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none;transition:.15s}
.icobtn svg{width:15px;height:15px}
.icobtn:active{transform:scale(.94)}
.icobtn.del{color:var(--err)}
.icobtn.ok{color:var(--ok);border-color:rgba(61,220,132,.4)}
.upbox{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.upbox .top{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:8px}
.upbox .nm{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:8px}
.upbox .nm svg{width:15px;height:15px;color:var(--gold2);flex:0 0 auto}
.upbox .sz{font-size:11.5px;color:var(--mut);flex:0 0 auto}
.bar{height:6px;border-radius:6px;background:#0a1428;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f5c542,#ffdd7a);transition:width .2s;border-radius:6px}
.st{font-size:11.5px;color:var(--mut);margin-top:7px}
.st.ok{color:var(--ok)} .st.err{color:var(--err)}
.note{font-size:11.5px;color:var(--mut);line-height:1.8;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:18px}
footer{text-align:center;color:#5c6f9c;font-size:11.5px;padding:26px 0 10px;line-height:1.8}
/* ===== 弹窗 ===== */
.modal{position:fixed;inset:0;background:rgba(4,8,18,.75);display:none;align-items:center;justify-content:center;z-index:20;padding:20px}
.modal.on{display:flex}
.mcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;width:100%;max-width:380px;max-height:82vh;overflow:auto}
.mcard h3{font-size:16px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.mcard h3 svg{width:18px;height:18px;color:var(--gold)}
.mcard input{width:100%;padding:12px 14px;background:#0a1428;border:1px solid var(--line);border-radius:10px;color:var(--txt);font-size:14px;outline:none;margin-bottom:12px}
.mcard input:focus{border-color:var(--gold)}
.mrow{display:flex;gap:8px}.mrow .btn{flex:1}
.merr{color:var(--err);font-size:12px;min-height:16px;margin-bottom:8px}
/* ===== 公告 ===== */
.ann{border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:10px;background:rgba(255,255,255,.02)}
.ann.new{border-color:rgba(245,197,66,.5);background:rgba(245,197,66,.05)}
.ann .ah{display:flex;align-items:center;gap:8px}
.ann .at{font-size:13.5px;font-weight:700;flex:1}
.ann .newtag{font-size:9.5px;color:#1a1405;background:var(--gold);border-radius:6px;padding:1.5px 6px;font-weight:800}
.ann .atime{font-size:11px;color:var(--mut);flex:0 0 auto}
.ann .ab{font-size:12.5px;color:var(--mut);line-height:1.8;margin-top:7px;white-space:pre-wrap;word-break:break-word}
.toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);background:#1c2b52;color:var(--txt);border:1px solid var(--line);padding:10px 20px;border-radius:12px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:30;max-width:86vw}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <button class="bellbtn" id="annBtn" onclick="openAnn()" aria-label="公告"><span class="ic"></span><span class="dot" id="annDot"></span></button>
    <div class="logo"><svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;display:block">
<defs>
<linearGradient id="lgA" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#2563eb"/><stop offset=".55" stop-color="#5b48e8"/><stop offset="1" stop-color="#7c3aed"/>
</linearGradient>
<linearGradient id="lgB" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#ffffff" stop-opacity=".3"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
</linearGradient>
</defs>
<rect x="2" y="2" width="44" height="44" rx="13" fill="url(#lgA)"/>
<rect x="2" y="2" width="44" height="22" rx="13" fill="url(#lgB)"/>
<g transform="translate(9.6,10.4) scale(1.2)"><path fill="#ffffff" d="m12 1.608 12 20.784H0Z"/></g>
</svg></div>
    <div><h1>ZJT 分发站</h1><div class="sub">APK 下载 · 文件托管</div></div>
  </header>

  <div class="tabs">
    <button class="tab on" id="t1" onclick="sw(1)"><span class="ic" data-i="package"></span>APK 下载</button>
    <button class="tab" id="t2" onclick="sw(2)"><span class="ic" data-i="folder"></span>文件托管</button>
  </div>

  <!-- APK 区 -->
  <div class="view on" id="v1"><div id="apklist"></div></div>

  <!-- 文件托管区 -->
  <div class="view" id="v2">
    <div class="acct" id="acctbar"></div>
    <div class="drop" id="drop" onclick="document.getElementById('fp').click()">
      <div class="big"><span class="ic" data-i="cloud-upload"></span></div>
      <p>点击选择文件，或将文件拖到此处</p>
      <span>先选择下方存放位置 · 支持多选 · 手机 / 电脑均可</span>
    </div>
    <input type="file" id="fp" multiple style="display:none">
    <div class="targ">
      <button class="tg on" id="tg0" onclick="setTarg(0)"><span class="ic" data-i="globe"></span>公开区 <i>所有人可见</i></button>
      <button class="tg" id="tg1" onclick="setTarg(1)"><span class="ic" data-i="lock"></span>私密区 <i>仅自己可见</i></button>
    </div>

    <div class="sechead"><h2><span class="ic" data-i="globe"></span>公开区</h2><span class="tag">所有人可见</span><a onclick="loadPublic()"><span class="ic" data-i="refresh-cw"></span>刷新</a></div>
    <div id="publist"></div>

    <div id="privsec" style="display:none">
      <div class="sechead"><h2><span class="ic" data-i="lock"></span>私密区</h2><span class="tag">仅自己可见</span></div>
      <div id="privlist"></div>
    </div>

    <div class="note">请勿上传违法违规内容；重要文件请自行留存备份。</div>
  </div>

  <footer>© 2026 ZJT 分发站</footer>
</div>

<!-- 账户弹窗 -->
<div class="modal" id="modal">
  <div class="mcard">
    <h3><span class="ic" data-i="user"></span><span id="mtitle">创建账户</span></h3>
    <div class="merr" id="merr"></div>
    <input id="mi1" placeholder="昵称" autocomplete="off">
    <input id="mi2" type="password" placeholder="密码" autocomplete="new-password">
    <div class="mrow">
      <button class="btn" id="mok" onclick="mOk()">创建并登录</button>
      <button class="btn ghost" onclick="mClose()">取消</button>
    </div>
  </div>
</div>

<!-- 公告弹窗 -->
<div class="modal" id="annModal">
  <div class="mcard">
    <h3><span class="ic" data-i="megaphone"></span>公告</h3>
    <div id="annList"></div>
    <div class="mrow"><button class="btn" onclick="ackAnn()">我知道了</button></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="icons.js"></script>
<script>
/* ================= 图标 ================= */
document.querySelectorAll('.ic[data-i]').forEach(el=>{el.innerHTML=LUCIDE[el.dataset.i]||''});
document.querySelector('#annBtn .ic').innerHTML=LUCIDE['bell']||'';
function ic(n){return '<span class="inl" style="display:inline-flex;vertical-align:-3px">'+(LUCIDE[n]||'')+'</span>'}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2000)}
function fmt(b){if(b==null)return'';const u=['B','KB','MB','GB'];let i=0;while(b>=1024&&i<3){b/=1024;i++}return b.toFixed(b<10&&i>0?1:0)+' '+u[i]}
function ticon(n){n=(n||'').toLowerCase();
  if(/\.(jpe?g|png|gif|webp|bmp|svg)$/.test(n))return 'image';
  if(/\.(mp4|mov|avi|mkv|webm|flv)$/.test(n))return 'file-video';
  if(/\.(mp3|wav|amr|flac|m4a|aac|ogg)$/.test(n))return 'file-audio';
  if(/\.(zip|rar|7z|tar|gz|bz2)$/.test(n))return 'file-archive';
  if(/\.apk$/.test(n))return 'package';
  if(/\.(txt|md|pdf|docx?|xlsx?|pptx?|json|html|csv)$/.test(n))return 'file-text';
  return 'file'}
const FB='https://'+'file'+'bin.'+'net';
const PUB_BIN='zjt-pub-9k2m';

/* ================= 公告 ================= */
let ANN={list:[]};
async function loadAnn(){
  try{
    const r=await fetch('announcements.json?v='+Date.now(),{cache:'no-store'});
    const d=await r.json();ANN=Array.isArray(d)?{list:d}:(d.list?d:{list:d.list||[]});
    if(!Array.isArray(ANN.list))ANN.list=[];
  }catch(e){ANN={list:[]}}
  renderAnnDot();
  const seen=localStorage.getItem('zjt_ann_seen');
  if(ANN.list.length&&(!seen||ANN.list[0].id!==seen))openAnn();
}
function renderAnnDot(){
  const seen=localStorage.getItem('zjt_ann_seen');
  const has=ANN.list.length&&(!seen||ANN.list[0].id!==seen);
  document.getElementById('annDot').classList.toggle('on',!!has);
}
function openAnn(){
  const box=document.getElementById('annList');
  box.innerHTML=ANN.list.map((a,i)=>`
    <div class="ann ${i===0?'new':''}">
      <div class="ah"><div class="at">${esc(a.title)}</div>${i===0?'<span class="newtag">NEW</span>':''}<div class="atime">${esc(a.time||'')}</div></div>
      <div class="ab">${esc(a.body)}</div>
    </div>`).join('')||'<div class="empty">暂无公告</div>';
  document.getElementById('annModal').classList.add('on');
}
function ackAnn(){
  if(ANN.list.length)localStorage.setItem('zjt_ann_seen',ANN.list[0].id);
  document.getElementById('annModal').classList.remove('on');
  renderAnnDot();
}
loadAnn();

/* ================= Tabs ================= */
function sw(n){
  for(let i=1;i<=2;i++){
    document.getElementById('t'+i).classList.toggle('on',i===n);
    document.getElementById('v'+i).classList.toggle('on',i===n);
  }
  if(n===2)loadPublic();
}

/* ================= APK 区 ================= */
async function loadApps(){
  const box=document.getElementById('apklist');
  try{
    const r=await fetch('apps.json?v='+Date.now(),{cache:'no-store'});
    const d=await r.json();
    const list=Array.isArray(d)?d:(d.apps||[]);
    if(!list.length){box.innerHTML='<div class="empty">📦 暂无上架应用<br>新版本将在此第一时间发布</div>';return}
    box.innerHTML=list.map((a,i)=>`
      <div class="apk">
        <div class="ic">${esc(a.icon||'⚡')}</div>
        <div style="flex:1;min-width:0">
          <h3>${esc(a.name)}</h3>
          <div class="meta">v${esc(a.version)} · ${a.size?('≈'+esc(a.size)+' · '):''}${esc(a.date||'')}</div>
          ${a.log?`<div class="log">${esc(a.log)}</div>`:''}
          <a class="btn" href="${esc(a.url)}"><span class="inl" style="display:inline-flex;vertical-align:-3px">${LUCIDE['download']}</span>下载 APK</a>
        </div>
      </div>`).join('');
  }catch(e){box.innerHTML='<div class="empty">应用列表加载失败，请刷新重试</div>'}
}
loadApps();

/* ================= 账户 ================= */
let ACCT=null;
try{ACCT=JSON.parse(localStorage.getItem('zjt_acct')||'null')}catch(e){}
function privRecs(){try{return JSON.parse(localStorage.getItem('zjt_files')||'[]')}catch(e){return[]}}
function savePriv(a){localStorage.setItem('zjt_files',JSON.stringify(a))}
function renderAcct(){
  const b=document.getElementById('acctbar');
  if(ACCT){b.innerHTML=`<div class="who">${ic('user')} <b>${esc(ACCT.n)}</b>&nbsp;· 已登录</div><a onclick="logout()">${ic('log-out')}退出</a>`}
  else{b.innerHTML=`<div class="who">${ic('user')} 未登录 · 私密区需创建账户</div><a onclick="mOpen('reg')">创建账户</a><a onclick="mOpen('login')">登录</a>`}
  document.getElementById('privsec').style.display=ACCT?'block':'none';
  renderPriv();
}
function logout(){localStorage.removeItem('zjt_acct');ACCT=null;setTarg(0);renderAcct();toast('已退出')}
function mOpen(kind){
  document.getElementById('modal').classList.add('on');
  document.getElementById('merr').textContent='';
  document.getElementById('mtitle').textContent=kind==='reg'?'创建账户':'登录账户';
  document.getElementById('mok').textContent=kind==='reg'?'创建并登录':'登录';
  document.getElementById('mok').dataset.k=kind;
  document.getElementById('mi1').value='';document.getElementById('mi2').value='';
}
function mClose(){document.getElementById('modal').classList.remove('on')}
function mOk(){
  const k=document.getElementById('mok').dataset.k;
  const n=document.getElementById('mi1').value.trim(), p=document.getElementById('mi2').value;
  const er=document.getElementById('merr');
  if(!n||!p){er.textContent='昵称和密码不能为空';return}
  if(k==='reg'){
    ACCT={n,p};localStorage.setItem('zjt_acct',JSON.stringify(ACCT));
    renderAcct();mClose();toast('账户已创建');
  }else{
    const a=(()=>{try{return JSON.parse(localStorage.getItem('zjt_acct')||'null')}catch(e){return null}})();
    if(a&&a.n===n&&a.p===p){ACCT=a;renderAcct();mClose();toast('登录成功')}
    else er.textContent='账户不存在或密码错误';
  }
}
renderAcct();

/* ================= 存放位置选择 ================= */
let TARG=0;
function setTarg(m){
  if(m===1&&!ACCT){mOpen('reg');toast('私密区需先创建账户');return}
  TARG=m;
  document.getElementById('tg0').classList.toggle('on',m===0);
  document.getElementById('tg1').classList.toggle('on',m===1);
}

/* ================= 私密区 ================= */
function renderPriv(){
  const box=document.getElementById('privlist');
  if(!ACCT){box.innerHTML='';return}
  const recs=privRecs();
  if(!recs.length){box.innerHTML='<div class="empty">暂无私密文件<br>在这里上传的文件仅自己可见</div>';return}
  box.innerHTML='';
  recs.forEach(r=>{
    const d=document.createElement('div');d.className='frow';
    d.innerHTML=`<div class="fi"><span class="ic" data-i="${ticon(r.n)}"></span></div>
      <div class="fmain"><div class="fn">${esc(r.n)}</div><div class="fm">${fmt(r.s)} · ${esc(r.d||'')}</div></div>
      <div class="fops">
        <a class="icobtn" href="${esc(r.u)}" target="_blank" rel="noopener" title="打开">${LUCIDE['external-link']}</a>
        <button class="icobtn" title="复制链接" onclick="cpLink(this,'${esc(r.u)}')">${LUCIDE['copy']}</button>
        <button class="icobtn del" title="删除" onclick="delPriv(this)">${LUCIDE['trash-2']}</button>
      </div>`;
    d.querySelector('.fi .ic').innerHTML=LUCIDE[ticon(r.n)]||LUCIDE['file'];
    d.dataset.rec=JSON.stringify(r);
    box.appendChild(d);
  });
}
async function delPriv(btn){
  const el=btn.closest('.frow');const r=JSON.parse(el.dataset.rec);
  btn.disabled=true;btn.style.opacity=.4;
  await platformDelete(r);
  savePriv(privRecs().filter(x=>x.u!==r.u));
  renderPriv();toast('已删除');
}
async function platformDelete(r){
  try{
    if(r.t==='f'&&r.del)await fetch(r.del,{method:'DELETE'});
    else if(r.t==='g'&&r.tk&&r.cid&&r.sv)await fetch('https://'+r.sv+'.'+'go'+'file'+'.io/contents/'+r.cid,{method:'DELETE',headers:{'Authorization':'Bearer '+r.tk}});
  }catch(e){}
}

/* ================= 公开区 ================= */
let PUB=[];
async function loadPublic(){
  const box=document.getElementById('publist');
  box.innerHTML='<div class="st" style="padding:6px 2px">加载中…</div>';
  try{
    const r=await fetch(`${FB}/${PUB_BIN}`,{headers:{'Accept':'application/json'},cache:'no-store'});
    if(r.status===404){PUB=[];renderPub();return}
    if(!r.ok)throw 0;
    const d=await r.json();
    const all=(d.files||[]);
    const dead=new Set(all.filter(f=>f.filename.startsWith('__del__'))
      .map(f=>f.filename.slice(7).replace(/__[a-z0-9]{6,10}\.d$/i,'')));
    PUB=all.filter(f=>!f.filename.startsWith('__del__')&&!dead.has(f.filename))
      .map(f=>({n:f.filename,s:f.bytes,u:`${FB}/${PUB_BIN}/${encodeURIComponent(f.filename)}`,
      d:(f.uploaded_at||'').slice(5,16).replace('T',' ')}));
    renderPub();
  }catch(e){box.innerHTML='<div class="st err" style="padding:6px 2px">列表加载失败，点「刷新」重试</div>'}
}
function renderPub(){
  const box=document.getElementById('publist');
  if(!PUB.length){box.innerHTML='<div class="empty">暂无公开文件<br>在这里上传的文件所有人可见</div>';return}
  box.innerHTML='';
  PUB.forEach(f=>{
    const d=document.createElement('div');d.className='frow';
    d.innerHTML=`<div class="fi"></div>
      <div class="fmain"><div class="fn">${esc(f.n)}</div><div class="fm">${fmt(f.s)}${f.d?' · '+esc(f.d):''}</div></div>
      <div class="fops">
        <a class="icobtn" href="${esc(f.u)}" target="_blank" rel="noopener" title="下载">${LUCIDE['download']}</a>
        <button class="icobtn" title="复制链接" onclick="cpLink(this,'${esc(f.u)}')">${LUCIDE['copy']}</button>
        <button class="icobtn del" title="删除" onclick="delPub(this)">${LUCIDE['trash-2']}</button>
      </div>`;
    d.querySelector('.fi').innerHTML=LUCIDE[ticon(f.n)]||LUCIDE['file'];
    d.dataset.fn=f.n;
    box.appendChild(d);
  });
}
async function delPub(btn){
  const el=btn.closest('.frow');const fn=el.dataset.fn;
  btn.disabled=true;btn.style.opacity=.4;btn.title='删除中';
  const marker='__del__'+fn+'__'+Math.random().toString(36).slice(2,10)+'.d';
  const ok=await new Promise(res=>{
    const x=new XMLHttpRequest();
    x.open('POST',`${FB}/${PUB_BIN}/${encodeURIComponent(marker)}`);x.timeout=60000;
    x.onload=()=>res(x.status>=200&&x.status<300);
    x.ontimeout=()=>res(false);x.onerror=()=>res(false);
    x.send(new Blob(['delete'],{type:'text/plain'}));
  });
  if(!ok){btn.disabled=false;btn.style.opacity=1;toast('删除失败，请检查网络后重试');return}
  try{await fetch(`${FB}/${PUB_BIN}/${encodeURIComponent(fn)}`,{method:'DELETE'})}catch(e){}
  PUB=PUB.filter(x=>x.n!==fn);renderPub();toast('已删除');
}
function cpLink(btn,u){
  (navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject())
    .then(()=>{btn.classList.add('ok');toast('链接已复制');setTimeout(()=>btn.classList.remove('ok'),1200)})
    .catch(()=>{const i=document.createElement('textarea');i.value=u;document.body.appendChild(i);i.select();document.execCommand('copy');i.remove();btn.classList.add('ok');toast('链接已复制');setTimeout(()=>btn.classList.remove('ok'),1200)});
}

/* ================= 上传 ================= */
const drop=document.getElementById('drop');
['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('on')}));
['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('on')}));
drop.addEventListener('drop',e=>handle([...e.dataTransfer.files]));
document.getElementById('fp').addEventListener('change',e=>{handle([...e.target.files]);e.target.value=''});

function upCard(f,listId){
  const d=document.createElement('div');d.className='upbox';
  d.innerHTML=`<div class="top"><div class="nm">${LUCIDE[ticon(f.name)]||LUCIDE['file']}${esc(f.name)}</div><div class="sz">${fmt(f.size)}</div></div>
    <div class="bar"><i></i></div><div class="st">排队中…</div>`;
  document.getElementById(listId).prepend(d);
  return {el:d,bar:d.querySelector('.bar i'),st:d.querySelector('.st')};
}
async function handle(files){
  for(const f of files){ if(TARG===0)await upPublic(f); else await upPrivate(f); }
}
function failMsg(c){c.st.className='st err';c.st.textContent='上传失败，请检查网络后重试'}
/* —— 公开 —— */
function upPublic(f){
  const c=upCard(f,'publist');c.st.textContent='上传中…';
  return new Promise(resolve=>{
    const rnd=Math.random().toString(36).slice(2,6);
    const send=fn=>new Promise((res,rej)=>{
      const x=new XMLHttpRequest();
      x.open('POST',`${FB}/${PUB_BIN}/${encodeURIComponent(fn)}`);
      x.timeout=120000;
      x.upload.onprogress=e=>{if(e.lengthComputable)c.bar.style.width=(e.loaded/e.total*100)+'%'};
      x.onload=()=>res(x);x.ontimeout=()=>rej(0);x.onerror=()=>rej(0);
      x.send(f);
    });
    (async()=>{
      try{
        let x=await send(f.name);
        if(x.status>=400)x=await send(f.name.replace(/(\.[^.]+)?$/,m=>'_'+rnd+(m||'')));
        if(x.status>=200&&x.status<300){
          c.bar.style.width='100%';c.st.className='st ok';c.st.textContent='上传完成';
          setTimeout(()=>{c.el.remove();loadPublic()},700);
        }else{c.st.className='st err';c.st.textContent='上传失败，请重试'}
      }catch(e){failMsg(c)}
      resolve();
    })();
  });
}
/* —— 私密 —— */
async function upPrivate(f){
  const c=upCard(f,'privlist');c.st.textContent='上传中…';
  try{
    const r=await fetch('https://api.'+'go'+'file'+'.io/servers',{cache:'no-store'});
    if(!r.ok)throw 0;
    const d=await r.json();const s=d.data.servers[0].name;
    const j=await xupload('https://'+s+'.'+'go'+'file'+'.io/contents/uploadfile',f,c);
    if(j&&j.status==='ok'&&j.data&&j.data.downloadPage){
      c.bar.style.width='100%';c.st.className='st ok';c.st.textContent='上传完成';
      savePriv([{n:f.name,s:f.size,u:j.data.downloadPage,t:'g',tk:j.data.guestToken||'',cid:j.data.id||'',sv:s,d:new Date().toLocaleString('zh-CN',{hour12:false})},...privRecs()]);
      setTimeout(()=>{c.el.remove();renderPriv()},700);
    }else throw 0;
  }catch(e1){
    c.bar.style.width='0%';c.st.textContent='切换通道…';
    try{await upFilebinPriv(f,c)}catch(e2){failMsg(c)}
  }
}
function upFilebinPriv(f,c){
  return new Promise((res,rej)=>{
    const bin=Math.random().toString(36).slice(2,10);
    const url=`${FB}/${bin}/${encodeURIComponent(f.name)}`;
    const x=new XMLHttpRequest();x.open('POST',url);x.timeout=120000;
    x.upload.onprogress=e=>{if(e.lengthComputable)c.bar.style.width=(e.loaded/e.total*100)+'%'};
    x.onload=()=>{
      if(x.status>=200&&x.status<300){
        const u=`${FB}/${bin}`;
        c.bar.style.width='100%';c.st.className='st ok';c.st.textContent='上传完成';
        savePriv([{n:f.name,s:f.size,u,t:'f',del:url,d:new Date().toLocaleString('zh-CN',{hour12:false})},...privRecs()]);res();
      }else rej(0);
    };
    x.ontimeout=()=>rej(0);x.onerror=()=>rej(0);x.send(f);
  });
}
function xupload(url,f,c){
  return new Promise((res,rej)=>{
    const x=new XMLHttpRequest();x.open('POST',url);x.timeout=120000;
    x.upload.onprogress=e=>{if(e.lengthComputable)c.bar.style.width=(e.loaded/e.total*90)+'%'};
    x.onload=()=>{try{res(JSON.parse(x.responseText))}catch(e){rej(e)}};
    x.ontimeout=()=>rej(0);x.onerror=()=>rej(0);
    const fd=new FormData();fd.append('file',f);x.send(fd);
  });
}
</script>
