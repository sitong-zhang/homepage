<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>真实粒子地球 · Accurate Particle Earth</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #000206;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
  }

  .loader-ring {

    position: fixed;
    bottom: 22px; left: 50%;

</style>

<body>

<div id="loading">
  <div class="loader-ring"></div>
  <div>加载高精度陆地数据</div>
  <div id="bar"><i></i></div>
  <div id="progress"></div>
  <button id="retry" onclick="location.reload()">重新加载</button>
</div>

<div id="hint">拖动旋转 · 滚轮缩放 · 转到背面可见太阳</div>
<div id="status"></div>

<!-- ===== 全局脚本：TopoJSON 与 D3-Geo ===== -->
<script src="./vendor/topojson-client.min.js"></script>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/build/three.module.js",
    "three/addons/": "./vendor/three/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls }   from 'three/addons/controls/OrbitControls.js';
import { EffectComposer }  from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }      from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass }      from 'three/addons/postprocessing/OutputPass.js';

/* ============================================================
   0. 全局配置
   ============================================================ */
const CFG = {
  radius        : 2.0,
  targetSamples : 200000,   // 球面目标采样数（最终粒子数 ≈ 陆地占比 × 此值）
  oceanKeep     : 0.02,     // 海洋粒子保留率（极低，仅作轮廓暗示）
};

// 太阳方向（世界空间，地球 → 太阳）
const SUN_DIR   = new THREE.Vector3(0.60, 0.28, 0.75).normalize();
const SUN_DIST  = 260;
const SUN_RADIUS = 8;

/* ============================================================
   1. 渲染器 / 场景 / 相机
   ============================================================ */
const renderer = new THREE.WebGLRenderer({
  antialias: true,
  powerPreference: 'high-performance',
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000206);

const camera = new THREE.PerspectiveCamera(
  50, window.innerWidth / window.innerHeight, 0.1, 4000
);
camera.position.set(0, 1.6, 6.8);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.rotateSpeed   = 0.65;
controls.zoomSpeed     = 0.8;
controls.minDistance   = 3.2;
controls.maxDistance   = 24;
controls.enablePan     = false;
controls.target.set(0, 0, 0);

/* ============================================================
   2. 高精度陆地数据 —— Natural Earth 1:10m
      使用 TopoJSON → GeoJSON → d3.geoContains 精确判定
   ============================================================ */
const progressEl = document.getElementById('progress');

function setProgress(text) {
  progressEl.textContent = text;
}

function setBar(p) {
  document.querySelector('#bar i').style.width =
    Math.max(0, Math.min(100, p * 100)).toFixed(1) + '%';
}
const frame = () => new Promise(r => requestAnimationFrame(r));
const LAND_BYTES = 3086715;   // land-10m.json 解压后字节数(分母)

async function loadLandGeoJSON() {
  const URLS = ['./vendor/land-10m.json'];

  for (const url of URLS) {
    for (let attempt = 0; attempt < 2; attempt++) {
      try {
        setProgress(attempt ? '网络停滞, 正在重试…' : '连接服务器…'); setBar(0.01);

        // 连接超时: 10 秒未响应即中止(绝不无限卡死)
        const ctrl = new AbortController();
        const kill = setTimeout(() => ctrl.abort(), 10000);
        const res = await fetch(url, { signal: ctrl.signal });
        clearTimeout(kill);
        if (!res.ok) throw new Error('HTTP ' + res.status);

        // 流式读取: 实时进度 + 停滞检测(4 秒无新数据 → 中止)
        const reader = res.body.getReader();
        const chunks = []; let received = 0, lastTick = Date.now();
        const stall = setInterval(() => {
          if (Date.now() - lastTick > 4000) { try { reader.cancel(); } catch (e) {} }
        }, 500);
        try {
          for (;;){
            const {done, value} = await reader.read();
            if (done) break;
            chunks.push(value); received += value.length; lastTick = Date.now();
            const p = Math.min(1, received / LAND_BYTES);
            setBar(0.01 + 0.69 * p);
            setProgress('下载陆地数据… ' + Math.round(p * 100) + '%');
          }
        } finally { clearInterval(stall); }

        if (received < LAND_BYTES * 0.9) throw new Error('下载不完整: ' + received);

        setProgress('解析陆地数据…'); setBar(0.72); await frame();
        const topo = JSON.parse(await new Blob(chunks).text());
        const land = topojson.feature(topo, topo.objects.land);
        setBar(0.78);
        console.log('[Earth] ✓ Natural Earth 1:10m 陆地数据已加载');
        return land;
      } catch (e) {
        console.warn('[Earth] 源失败:', url, e);
        if (attempt === 0) { setProgress('连接中断, 重试中…'); await new Promise(r => setTimeout(r, 800)); }
      }
    }
  }
  return null;
}

/* ============================================================
   3. 几何工具
   ============================================================ */
// 球面均匀采样（Fibonacci）
function fibSphere(i, n) {
  const y     = 1 - (i / (n - 1)) * 2;
  const r     = Math.sqrt(Math.max(0, 1 - y * y));
  const theta = i * Math.PI * (3 - Math.sqrt(5));
  return [Math.cos(theta) * r, y, Math.sin(theta) * r];
}

// 笛卡尔 → 经纬度（度）
function toLonLat(x, y, z) {
  const len = Math.sqrt(x * x + y * y + z * z) || 1;
  const nx = x / len, ny = y / len, nz = z / len;
  const lon = Math.atan2(nz, nx) * 180 / Math.PI;          // -180 .. 180
  const lat = Math.asin(Math.max(-1, Math.min(1, ny))) * 180 / Math.PI; // -90 .. 90
  return [lon, lat];
}

/* ============================================================
   4. 着色器
   ------------------------------------------------------------
   光照固定在世界空间指向太阳；
   粒子为圆形点，带柔和发光。
   ============================================================ */
const VERT = /* glsl */`
  attribute float size;
  attribute vec3  aColor;

  uniform float uPixelRatio;
  uniform float uSizeScale;
  uniform vec3  uLightDir;      // 世界空间：星球 → 太阳

  varying vec3  vColor;

  void main() {
    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);

    // 世界空间法线（球面方向即法线）
    vec3 n = normalize(mat3(modelMatrix) * normalize(position));

    // 太阳漫反射（柔和明暗交界）
    float d   = dot(n, uLightDir);
    float sun = smoothstep(-0.08, 0.55, d);

    // 受光面：暖白；背光面：极暗冷蓝
    vec3 tint = mix(vec3(0.08, 0.11, 0.18), vec3(1.0, 0.97, 0.92), sun);

    vColor = aColor * tint;

    gl_PointSize = size * uSizeScale * uPixelRatio * (17.0 / -mvPosition.z);
    gl_Position  = projectionMatrix * mvPosition;
  }
`;

const FRAG = /* glsl */`
  varying vec3 vColor;

  void main() {
    // 圆形点 + 柔和边缘
    vec2  uv = gl_PointCoord - 0.5;
    float d2 = dot(uv, uv);
    if (d2 > 0.25) discard;

    float a = smoothstep(0.21, 0.08, d2);
    gl_FragColor = vec4(vColor, a);
  }
`;

/* ============================================================
   4.5 陆地查找表 —— 10m 边界一次性光栅化
   把 d3.geoContains 的逐点球面几何计算(分钟级)
   换成 canvas 光栅化 + O(1) 查表(亚秒级), 采样配置不变
   ============================================================ */
function rasterizeLand(landGeo){
  const W = 2048, H = 1024;                       // 0.176°/px
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d', { willReadFrequently: true });
  ctx.fillStyle = '#ff0000';

  const geoms = landGeo.type === 'FeatureCollection'
    ? landGeo.features.map(f => f.geometry)
    : (landGeo.type === 'Feature' ? [landGeo.geometry] : [landGeo]);

  for (const g of geoms){
    const polys = g.type === 'Polygon' ? [g.coordinates]
                : (g.type === 'MultiPolygon' ? g.coordinates : []);
    for (const poly of polys){
      ctx.beginPath();
      for (const ring of poly){
        for (let k = 0; k < ring.length; k++){
          const x = (ring[k][0] + 180) / 360 * W;
          const y = (90  - ring[k][1]) / 180 * H;
          k === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        }
        ctx.closePath();
      }
      ctx.fill('evenodd');                        // evenodd 正确处理内湖(里海等)
    }
  }
  const data = ctx.getImageData(0, 0, W, H).data; // alpha>40 即陆地
  return { data, W, H };
}

function isLandAt(t, lon, lat){
  let x = Math.floor((lon + 180) / 360 * t.W); if (x < 0) x = 0; if (x >= t.W) x = t.W - 1;
  let y = Math.floor((90  - lat) / 180 * t.H); if (y < 0) y = 0; if (y >= t.H) y = t.H - 1;
  return t.data[(y * t.W + x) * 4 + 3] > 40;
}

/* ============================================================
   5. 构建粒子地球
   ============================================================ */
async function buildEarth(landGeo) {
  const N = CFG.targetSamples;
  const R = CFG.radius;

  const posArr  = [];
  const colArr  = [];
  const sizeArr = [];

  const col = new THREE.Color();

  // 陆地查找表(光栅化一次, 之后 20 万采样全部 O(1) 查表)
  const landTable = rasterizeLand(landGeo);

  let checked = 0;
  let landCount = 0;
  let oceanCount = 0;

  for (let i = 0; i < N; i++) {
    const [x, y, z] = fibSphere(i, N);

    // 每 2 万点让出一次主线程: 进度条实时平滑刷新
    if (i % 20000 === 0) {
      setProgress(`采样陆地粒子… ${Math.round(i / N * 100)}%`);
      setBar(0.9 + 0.1 * (i / N));
      await frame();
    }

    // 经纬度判定
    const [lon, lat] = toLonLat(x, y, z);
    const isLand = isLandAt(landTable, lon, lat);

    checked++;

    if (isLand) {
      landCount++;
    } else {
      // 海洋：极低概率保留，仅作轮廓暗示
      if (Math.random() > CFG.oceanKeep) continue;
      oceanCount++;
    }

    // 半径微抖动，形成薄壳
    const jitter = 1 + (Math.random() - 0.5) * 0.008;
    const rr     = R * jitter * (isLand ? 1.006 : 1.0);

    posArr.push(x * rr, y * rr, z * rr);

    if (isLand) {
      // 陆地：青蓝 → 浅冰蓝，带纬度变化
      const t = Math.random();
      const latFactor = Math.abs(lat) / 90; // 极地更白
      col.setHSL(
        0.540 + t * 0.040 - latFactor * 0.02,
        0.65  - t * 0.30 - latFactor * 0.25,
        0.52  + t * 0.14 + latFactor * 0.12
      );
    } else {
      // 海洋：深蓝
      const t = Math.random();
      col.setHSL(0.610 + t * 0.030, 0.88, 0.10 + t * 0.08);
    }

    colArr.push(col.r, col.g, col.b);

    // 粒子大小：陆地更大，海洋极小
    sizeArr.push(
      isLand
        ? 1.00 + Math.random() * 0.60
        : 0.42 + Math.random() * 0.25
    );
  }

  // ===== 球体内部填充: 球面聚集更多粒子, 向内渐稀, 让星球是"实"的 =====
  const INNER = 80000;
  for (let j = 0; j < INNER; j++){
    // 均匀球内方向
    const u  = Math.random() * 2 - 1;
    const th = Math.random() * Math.PI * 2;
    const rr0 = Math.sqrt(Math.max(0, 1 - u * u));
    const dx = rr0 * Math.cos(th), dy = u, dz = rr0 * Math.sin(th);
    // 半径偏向球面(平方分布), 深入 0.55R ~ 0.995R
    const r = R * (1 - Math.pow(Math.random(), 2.2) * 0.45);
    posArr.push(dx * r, dy * r, dz * r);

    const t = Math.random();
    col.setHSL(0.585 + t * 0.030, 0.80, 0.06 + t * 0.07);   // 深蓝内核, 比表面暗
    colArr.push(col.r, col.g, col.b);
    sizeArr.push(0.45 + Math.random() * 0.35);
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(posArr, 3));
  geo.setAttribute('aColor',   new THREE.Float32BufferAttribute(colArr, 3));
  geo.setAttribute('size',     new THREE.Float32BufferAttribute(sizeArr, 1));
  geo.computeBoundingSphere();

  const mat = new THREE.ShaderMaterial({
    uniforms: {
      uPixelRatio : { value: renderer.getPixelRatio() },
      uSizeScale  : { value: 1.0 },
      uLightDir   : { value: SUN_DIR.clone() },
    },
    vertexShader   : VERT,
    fragmentShader : FRAG,
    transparent    : true,
    depthWrite     : true,
    depthTest      : true,
    blending       : THREE.NormalBlending,
  });

  const points = new THREE.Points(geo, mat);

  // 地轴倾角 23.5°
  const group = new THREE.Group();
  group.rotation.z = THREE.MathUtils.degToRad(23.5);
  group.add(points);
  scene.add(group);

  console.log(
    `[Earth] 采样 ${checked} 点 · 陆地 ${landCount} · 海洋 ${oceanCount} · ` +
    `最终粒子 ${posArr.length / 3}`
  );

  return { points, mat, group, count: posArr.length / 3, landCount };
}

/* ============================================================
   6. 远处太阳
   ============================================================ */
function makeGlowTexture() {
  const S = 256;
  const cv = document.createElement('canvas');
  cv.width = cv.height = S;
  const ctx = cv.getContext('2d');

  const g = ctx.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
  g.addColorStop(0.00, 'rgba(255, 250, 235, 1.00)');
  g.addColorStop(0.14, 'rgba(255, 225, 170, 0.72)');
  g.addColorStop(0.34, 'rgba(255, 180,  95, 0.24)');
  g.addColorStop(0.62, 'rgba(255, 140,  50, 0.07)');
  g.addColorStop(1.00, 'rgba(255, 110,  20, 0.00)');

  ctx.fillStyle = g;
  ctx.fillRect(0, 0, S, S);

  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function buildSun() {
  const sunPos = SUN_DIR.clone().multiplyScalar(SUN_DIST);

  // 核心
  const coreGeo = new THREE.SphereGeometry(SUN_RADIUS, 32, 32);
  const coreMat = new THREE.MeshBasicMaterial({ color: 0xfff4dd });
  const core = new THREE.Mesh(coreGeo, coreMat);
  core.position.copy(sunPos);
  scene.add(core);

  // 光晕
  const glowMat = new THREE.SpriteMaterial({
    map        : makeGlowTexture(),
    color      : 0xffd9a0,
    blending   : THREE.AdditiveBlending,
    transparent: true,
    depthWrite : false,
    depthTest  : true,
  });
  const glow = new THREE.Sprite(glowMat);
  glow.position.copy(sunPos);
  glow.scale.set(80, 80, 1);
  scene.add(glow);

  return { core, glow, pos: sunPos };
}

/* ============================================================
   7. 深空背景星尘
   ============================================================ */
function buildStarfield() {
  const COUNT = 4500;
  const pos = new Float32Array(COUNT * 3);
  const col = new Float32Array(COUNT * 3);
  const siz = new Float32Array(COUNT);
  const pha = new Float32Array(COUNT);

  const c = new THREE.Color();

  for (let i = 0; i < COUNT; i++) {
    const r     = 60 + Math.pow(Math.random(), 0.6) * 700;
    const theta = Math.random() * Math.PI * 2;
    const phi   = Math.acos(2 * Math.random() - 1);

    pos[i * 3    ] = r * Math.sin(phi) * Math.cos(theta);
    pos[i * 3 + 1] = r * Math.cos(phi);
    pos[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);

    c.setHSL(Math.random(), 0.60, 0.14 + Math.random() * 0.20);
    col[i * 3    ] = c.r;
    col[i * 3 + 1] = c.g;
    col[i * 3 + 2] = c.b;

    siz[i] = 0.7 + Math.random() * 2.0;
    pha[i] = Math.random() * Math.PI * 2;
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('aColor',   new THREE.BufferAttribute(col, 3));
  geo.setAttribute('size',     new THREE.BufferAttribute(siz, 1));
  geo.setAttribute('phase',    new THREE.BufferAttribute(pha, 1));

  const mat = new THREE.ShaderMaterial({
    uniforms: {
      uTime       : { value: 0 },
      uPixelRatio : { value: renderer.getPixelRatio() },
    },
    vertexShader: /* glsl */`
      attribute float size;
      attribute float phase;
      attribute vec3  aColor;

      uniform float uTime;
      uniform float uPixelRatio;

      varying vec3  vColor;
      varying float vAlpha;

      void main() {
        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
        vColor = aColor;
        vAlpha = 0.35 + 0.55 * (0.5 + 0.5 * sin(uTime * 0.85 + phase));
        gl_PointSize = size * uPixelRatio * (18.0 / -mvPosition.z);
        gl_Position  = projectionMatrix * mvPosition;
      }
    `,
    fragmentShader: /* glsl */`
      varying vec3  vColor;
      varying float vAlpha;
      void main() {
        vec2  uv = gl_PointCoord - 0.5;
        float d2 = dot(uv, uv);
        if (d2 > 0.25) discard;
        float a = smoothstep(0.25, 0.0, d2);
        gl_FragColor = vec4(vColor, a * vAlpha);
      }
    `,
    transparent : true,
    depthWrite  : false,
    blending    : THREE.AdditiveBlending,
  });

  const pts = new THREE.Points(geo, mat);
  scene.add(pts);
  return pts;
}

/* ============================================================
   8. 后期处理
   ============================================================ */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));

const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  0.45,   // strength —— 柔和
  0.55,   // radius
  0.78    // threshold —— 高，仅太阳触发
);
composer.addPass(bloomPass);
composer.addPass(new OutputPass());

/* ============================================================
   9. 初始化
   ============================================================ */
let earth     = null;
let starfield = null;
let sunRef    = null;

(async () => {
  const landGeo = await loadLandGeoJSON();

  if (!landGeo) {
    console.error('[Earth] 无法加载陆地数据');
    setProgress('加载失败, 请检查网络');
    document.querySelector('#bar').classList.add('err');
    document.getElementById('retry').style.display = 'inline-block';
    return;
  }

  setProgress('光栅化陆地边界…'); setBar(0.8); await frame();
  earth     = await buildEarth(landGeo);
  setBar(1);
  starfield = buildStarfield();
  sunRef    = buildSun();

  document.getElementById('status').textContent =
    `Natural Earth 1:10m · ${earth.count.toLocaleString()} 颗粒子`;

  const el = document.getElementById('loading');
  el.classList.add('hide');
  setTimeout(() => el.remove(), 1000);
  document.getElementById('hint').classList.add('show');

  console.log(
    `%c✦ 真实粒子地球就绪 · ${earth.count.toLocaleString()} 颗粒子 · ` +
    `陆地采样 ${earth.landCount.toLocaleString()} 点`,
    'color:#4a9eff;font-size:13px;font-weight:600;'
  );
})();

/* ============================================================
   10. 主循环
   ============================================================ */
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  const t = clock.getElapsedTime();
  controls.update();

  if (earth) {
    earth.points.rotation.y = t * 0.05;
  }

  if (starfield) {
    starfield.material.uniforms.uTime.value = t;
    starfield.rotation.y = t * 0.004;
  }

  if (sunRef) {
    const pulse = 1 + 0.035 * Math.sin(t * 1.1);
    sunRef.glow.scale.set(80 * pulse, 80 * pulse, 1);
  }

  composer.render();
}

animate();

/* ============================================================
   11. 自适应
   ============================================================ */
window.addEventListener('resize', () => {
  const w = window.innerWidth;
  const h = window.innerHeight;

  camera.aspect = w / h;
  camera.updateProjectionMatrix();

  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(w, h);

  composer.setSize(w, h);
  bloomPass.setSize(w, h);

  const pr = renderer.getPixelRatio();
  if (earth)     earth.mat.uniforms.uPixelRatio.value = pr;
  if (starfield) starfield.material.uniforms.uPixelRatio.value = pr;
});
</script>

    navigator.serviceWorker.register('./sw.js').catch(function(){});
  });
}
